.jf-ekstra{display:flex;gap:8px;flex-wrap:wrap}.jf-ekstra div{position:relative}.jf-ekstra span{display:block;width:84px;height:84px;border-radius:8px;background:var(--soft) center/cover}

.jf-arr{margin-top:14px}.jf-arr summary{cursor:pointer;color:var(--teal);font-weight:600;font-size:14px}

<script>
(function () {
'use strict';
const KONFIG = window.RTK_KONFIG;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hent = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const gem = (k, v) => { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} };
const nyId = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
let enhed = hent('rtk.enhed'); if (!enhed) { enhed = nyId(); gem('rtk.enhed', enhed); }
// Gæsten har sit eget login (rtk.jul.token), så det aldrig blandes med Mit RTK. Arrangøren bruger sit almindelige login
const KODE_URL = (/[?&]k=([A-Za-z0-9]{6,24})/.exec(location.search) || [])[1] || '';
const token = () => hent('rtk.jul.token') || hent('rtk.token') || '';

async function motor(modul, handling, data, id, forsoeg) {
  let res, svar;
  try {
    res = await fetch(KONFIG.motor, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ modul, handling, data: data || {}, token: token(), id: id || '' }) });
    svar = await res.json();
  } catch (e) { throw new Error('Ingen forbindelse. Tjek net og prøv igen.'); }
  if (!svar.ok) {
    if (svar.igen && (forsoeg || 0) < 2) { await new Promise((ok) => setTimeout(ok, 500)); return motor(modul, handling, data, id, (forsoeg || 0) + 1); }
    if (svar.login) { const e = new Error(svar.fejl || 'Log ind igen'); e.login = true; throw e; }
    throw new Error(svar.fejl || 'Noget gik galt');
  }
  return svar.data;
}

// ---------- Tilstand
const S = { bid: '', pid: '', arr: false, b: null, del: {}, besk: [], bill: [], mini: {}, aaben: null, lyt: [], fb: null, gaester: null, profiler: {} };

// ---------- Login
function visLogin(fejl) {
  $('vent').classList.add('jf-skjult'); $('app').classList.add('jf-skjult');
  const l = $('login'); l.classList.remove('jf-skjult');
  l.innerHTML = '<div class="jf-hero"><img src="ikoner/jul-logo.svg" alt=""><div><b>Julefrokost 🎄</b><span class="u">Roskilde Tennis Gentlemen møder Onsdags Padel &amp; Pils</span><span>Torsdag 3. december</span></div></div>' +
    '<p>Siden er kun for de 16 til julefrokosten. Brug linket, du har fået fra Lars. Står der en kode i beskeden, kan du skrive den her.</p>' +
    '<form id="kodeForm" class="card jf-boks" novalidate><label for="kode" style="font-weight:600">Din kode</label>' +
    '<input id="kode" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" maxlength="20" placeholder="fx ABCD-2345" style="width:100%;box-sizing:border-box;margin:6px 0 10px;text-transform:uppercase;letter-spacing:.1em">' +
    '<button class="primary" style="width:100%">Log ind</button><div class="msg jf-msg" id="kodeMsg" role="status"></div></form>' +
    '<details class="jf-arr"><summary>Er du arrangør? Log ind med dit mobilnummer</summary>' +
    '<form id="smsForm" class="card jf-boks" novalidate><label for="mobil" style="font-weight:600">Dit mobilnummer</label>' +
    '<input id="mobil" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" style="width:100%;box-sizing:border-box;margin:6px 0 10px">' +
    '<div id="smsKodeDel" class="jf-skjult"><label for="smsKode" style="font-weight:600">Koden fra sms\'en</label>' +
    '<input id="smsKode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" style="width:100%;box-sizing:border-box;margin:6px 0 10px"></div>' +
    '<button class="ghost" id="smsKnap" style="width:100%">Send kode på sms</button><div class="msg jf-msg" id="smsMsg" role="status"></div></form></details>';
  if (fejl) { $('kodeMsg').textContent = fejl; $('kodeMsg').className = 'msg err jf-msg'; }
  $('kodeForm').addEventListener('submit', (e) => { e.preventDefault(); logIndMedKode($('kode').value, $('kodeMsg')); });
  // Arrangøren er en almindelig person i Mit RTK og logger ind med sms. På en anden adresse end mitrtk.dk (racketcircle.dk)
  // kender siden ikke Mit RTK's login, så det kan gøres her (Lars 23. november kl. 21.37)
  let kodeSendt = false;
  $('smsForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const m = $('smsMsg'); m.className = 'msg jf-msg';
    try {
      if (!kodeSendt) {
        m.textContent = 'Sender koden …';
        const r = await motor('kerne', 'sendKode', { mobil: $('mobil').value, kanal: 'sms', enhed });
        kodeSendt = true; $('smsKodeDel').classList.remove('jf-skjult'); $('smsKnap').textContent = 'Log ind';
        m.textContent = 'Koden er sendt' + (r && r.til ? ' til ' + r.til : '') + '. Den gælder i 10 minutter.'; $('smsKode').focus();
      } else {
        m.textContent = 'Logger ind …';
        const s2 = await motor('kerne', 'kodeLogin', { mobil: $('mobil').value, kode: $('smsKode').value, enhed, husk: true });
        gem('rtk.jul.token', null); gem('rtk.token', s2.token);
        await start(false);
      }
    } catch (err) { m.textContent = err.message; m.className = 'msg err jf-msg'; }
  });
}
async function logIndMedKode(kode, msg, fraUrl) {
  if (msg) { msg.textContent = 'Logger ind …'; msg.className = 'msg jf-msg'; }
  try {
    const s = await motor('jul', 'kodeLogin', { kode, enhed });
    gem('rtk.jul.token', s.token);
    // Koden bliver stående i adressen (?k=), så siden på hjemmeskærmen kan logge ind selv. På iPhone har den sit eget lager
    // adskilt fra Safari (gennemgangen 23. november, fund 6)
    S.kode = String(kode).toUpperCase().replace(/[^A-Z0-9]/g, '');
    history.replaceState(null, '', location.pathname + '?k=' + S.kode + '#program');
    await start(true);
  } catch (err) {
    if (msg) { msg.textContent = err.message; msg.className = 'msg err jf-msg'; return; }
    // En kode, der ikke virker, fjernes fra adressen, så den ikke prøves igen ved næste åbning
    if (/passer ikke/.test(err.message)) history.replaceState(null, '', location.pathname + '#program');
    visLogin(fraUrl && /passer ikke/.test(err.message) ? 'Dit link er ikke gyldigt længere. Bed Lars om et nyt.' : err.message);
  }
}

// ---------- Firebase
async function hentFirebase() {
  if (S.fb) return S.fb;
  const base = 'https://www.gstatic.com/firebasejs/' + KONFIG.firebaseVersion + '/';
  const [app, auth, fs] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
  const emu = window.RTK_EMULATOR;
  // En egen Firebase-app, så julefrokostens login aldrig blandes med Grupper på samme telefon
  const a = app.getApps().find((x) => x.name === 'jul') || app.initializeApp(emu && emu.projekt ? Object.assign({}, KONFIG.firebase, { projectId: emu.projekt }) : KONFIG.firebase, 'jul');
  const au = auth.initializeAuth(a, { persistence: [auth.indexedDBLocalPersistence, auth.browserLocalPersistence] });
  const db = fs.getFirestore(a);
  if (emu) { auth.connectAuthEmulator(au, 'http://127.0.0.1:9099', { disableWarnings: true }); fs.connectFirestoreEmulator(db, '127.0.0.1', 8080); }
  S.fb = { app, auth, fs, au, db };
  return S.fb;
}
async function logIndFirebase() {
  const F = await hentFirebase();
  await F.au.authStateReady();
  const binding = String(token()).slice(-12);
  let u = F.au.currentUser;
  if (u && (u.uid !== S.pid || hent('rtk.jul.fb') !== binding)) { await F.auth.signOut(F.au).catch(() => {}); u = null; }
  if (!u) {
    const t = await motor('kerne', 'firebase');
    await F.auth.signInWithCustomToken(F.au, t.token);
    gem('rtk.jul.fb', binding);
  }
}

// ---------- Start
async function start(fraLink) {
  if (!token()) { visLogin(); return; }
  let s;
  try { s = await motor('jul', 'start'); }
  catch (err) {
    if (err.login && hent('rtk.jul.token') && KODE_URL && !S.provetUrl) { S.provetUrl = true; gem('rtk.jul.token', null); return logIndMedKode(KODE_URL, null, true); }
    if (err.login || /ikke med/.test(err.message)) { gem('rtk.jul.token', null); visLogin(err.login ? 'Dit link er ikke gyldigt længere. Bed Lars om et nyt.' : (hent('rtk.token') ? 'Du er logget ind på Mit RTK, men du er ikke med i julefrokosten.' : '')); return; }
    $('login').classList.add('jf-skjult'); $('vent').classList.remove('jf-skjult');
    $('vent').innerHTML = '<p class="msg err">' + esc(err.message) + '</p><button class="ghost" onclick="location.reload()">Prøv igen</button>'; return;
  }
  S.bid = s.bid; S.pid = s.pid; S.arr = !!s.arrangoer; S.navn = s.navn;
  try { await logIndFirebase(); }
  catch (err) { console.warn('firebase', err); $('login').classList.add('jf-skjult'); $('vent').classList.remove('jf-skjult'); $('vent').innerHTML = '<p class="msg err">Chatten kan ikke åbnes lige nu. Prøv igen om lidt.</p><button class="ghost" onclick="location.reload()">Prøv igen</button>'; return; }
  $('login').classList.add('jf-skjult'); $('vent').classList.add('jf-skjult'); $('app').classList.remove('jf-skjult');
  $('fLinks').classList.toggle('jf-skjult', !S.arr);
  lyt();
  if (fraLink) S.velkommen = true;
  rute();
}

function lyt() {
  const F = S.fb, fs = F.fs, db = F.db, b = 'jul/' + S.bid;
  S.lyt.forEach((x) => x()); S.lyt = [];
  const fejl = (e) => { console.warn(e); if (/permission/i.test(String(e && e.code || e))) { gem('rtk.jul.token', null); visLogin('Dit link er ikke gyldigt længere. Bed Lars om et nyt.'); } };
  S.lyt.push(fs.onSnapshot(fs.doc(db, b), (d) => { S.b = d.data() || null; if (S.b && S.b.under) $('topUnder').textContent = S.b.under; tegn(); }, fejl));
  S.lyt.push(fs.onSnapshot(fs.collection(db, b + '/deltagere'), (q) => { S.del = {}; q.forEach((d) => { S.del[d.id] = d.data(); }); tegn(); }, fejl));
  S.lyt.push(fs.onSnapshot(fs.query(fs.collection(db, b + '/beskeder'), fs.orderBy('tid', 'desc'), fs.limit(300)), (q) => {

function tilJpeg(fil, maks, maksTegn, kvadrat) {
  return new Promise((ok, nej) => {
    const url = URL.createObjectURL(fil);
    const img = new Image();
    img.onload = () => {
      let sw = img.naturalWidth, sh = img.naturalHeight, sx = 0, sy = 0;
      if (kvadrat) { const s = Math.min(sw, sh); sx = (sw - s) / 2; sy = (sh - s) / 2; sw = sh = s; }
      const k = Math.min(1, maks / Math.max(sw, sh));
      const c = document.createElement('canvas'); c.width = Math.round(sw * k); c.height = Math.round(sh * k);
      c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      let q = 0.85, d = c.toDataURL('image/jpeg', q);
      while (d.length > maksTegn && q > 0.3) { q -= 0.1; d = c.toDataURL('image/jpeg', q); }
      let cc = c;
      while (d.length > maksTegn && cc.width > 64) {
        const n = document.createElement('canvas'); n.width = Math.round(cc.width * 0.75); n.height = Math.round(cc.height * 0.75);
        n.getContext('2d').drawImage(cc, 0, 0, n.width, n.height); cc = n; d = cc.toDataURL('image/jpeg', 0.6);
      }
      if (d.length > maksTegn) nej(new Error('Billedet er for stort')); else ok(d);
    };
    img.onerror = () => { URL.revokeObjectURL(url); nej(new Error('Billedet kunne ikke læses')); };
    img.src = url;
  });
}

      catch (err) { msg.textContent = err.message; msg.className = 'msg err jf-msg'; }
    });
    if ($('pBilFjern')) $('pBilFjern').addEventListener('click', () => { p.tekst = $('pTekst').value; p.niveau = { tennis: Number($('pTennis').value), padel: Number($('pPadel').value) }; R.billede = ''; R.stor0 = ''; R.mini = ''; tegnR(); });
    if ($('pEkstra')) $('pEkstra').addEventListener('change', async (e) => {
      const f = e.target.files[0]; if (!f) return;
      msg.textContent = 'Gør billedet klar …';
      try { const tekst = $('pTekst').value; const [b, stor] = await Promise.all([tilJpeg(f, 320, 29000, true), tilJpeg(f, 1200, 390000)]); R.ekstra.push({ b, stor }); p.tekst = tekst; p.niveau = { tennis: Number($('pTennis').value), padel: Number($('pPadel').value) }; tegnR(); }
      catch (err) { msg.textContent = err.message; msg.className = 'msg err jf-msg'; }
    });
    document.querySelectorAll('[data-fjern]').forEach((k) => k.addEventListener('click', () => { p.tekst = $('pTekst').value; p.niveau = { tennis: Number($('pTennis').value), padel: Number($('pPadel').value) }; R.ekstra.splice(Number(k.getAttribute('data-fjern')), 1); R.ekstraAendret = true; tegnR(); }));
    $('profForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = 'Gemmer …'; msg.className = 'msg jf-msg';
      const F = S.fb, b = 'jul/' + S.bid + '/';
      try {
        const w = F.fs.writeBatch(F.db);
        w.set(F.fs.doc(F.db, b + 'profiler/' + S.pid), { billede: R.billede || '', ekstra: R.ekstra.map((x) => x.b), tekst: $('pTekst').value.trim().slice(0, 300),
          niveau: { tennis: Number($('pTennis').value), padel: Number($('pPadel').value) }, opdateret: F.fs.serverTimestamp() });
        if (R.stor0 !== null) {
          if (R.stor0) w.set(F.fs.doc(F.db, b + 'profilStor/' + S.pid + '_0'), { data: R.stor0, opdateret: F.fs.serverTimestamp() }); else w.delete(F.fs.doc(F.db, b + 'profilStor/' + S.pid + '_0'));
          if (R.mini) w.set(F.fs.doc(F.db, b + 'mini/' + S.pid), { mini: R.mini, opdateret: F.fs.serverTimestamp() }); else w.delete(F.fs.doc(F.db, b + 'mini/' + S.pid));
        }
        // De store udgaver af de andre billeder følger rækkefølgen. Et billede uden ny stor udgave beholder sin gamle, hvis den ikke er flyttet
        if (R.ekstra.some((x) => x.stor) || R.ekstraAendret) {
          const gamle = await Promise.all([1, 2, 3].map((i) => F.fs.getDoc(F.fs.doc(F.db, b + 'profilStor/' + S.pid + '_' + i)).then((d) => (d.exists() ? d.data().data : '')).catch(() => '')));
          const gl = (p.ekstra || []);
          [0, 1, 2].forEach((i) => {
            const x = R.ekstra[i];
            const ref = F.fs.doc(F.db, b + 'profilStor/' + S.pid + '_' + (i + 1));
            if (!x) { w.delete(ref); return; }
            const data = x.stor || gamle[gl.indexOf(x.b)] || '';
            if (data) w.set(ref, { data, opdateret: F.fs.serverTimestamp() }); else w.delete(ref);
          });
        }
        await w.commit();
        delete S.profiler[S.pid];
        S.travlt = false;
        msg.textContent = 'Gemt.'; msg.className = 'msg okm jf-msg';
        setTimeout(() => { if (fane() === 'profil') location.hash = '#deltagere'; }, 700);
      } catch (err) { console.warn(err); msg.textContent = 'Profilkortet blev ikke gemt. Prøv igen.'; msg.className = 'msg err jf-msg'; }
    });
  };
  tegnR();
}

// ---------- Links (kun arrangøren)
const linkTil = (kode) => location.origin + '/jul.html#k=' + kode;
async function tegnLinks(ny) {
  if (ny || !S.gaester) {
    $('vis').innerHTML = '<p class="hint">Henter …</p>';
    try { S.gaester = (await motor('jul', 'gaester')).gaester; }
    catch (err) { $('vis').innerHTML = '<p class="msg err">' + esc(err.message) + '</p>'; return; }
    if (fane() !== 'links') return;
  }
  let h = '<h2 style="margin:0 0 4px">Links og koder</h2><p class="jf-lille">Kun for dig. Send hver sit link privat, fx på WhatsApp. Et tryk på linket logger ind i 30 dage.</p>';
  S.gaester.forEach((g) => {
    if (g.arrangoer) return;
    h += '<div class="jf-d" style="flex-wrap:wrap">' + avatar(g.pid, 34) + '<div style="flex:1;min-width:120px"><b>' + esc(g.navn) + '</b><span' + (g.sidstInde ? '' : ' style="color:var(--pink)"') + '>' + (g.sidstInde ? 'Logget ind ' + esc(g.sidstInde.slice(8, 10) + '/' + g.sidstInde.slice(5, 7) + ' kl. ' + g.sidstInde.slice(11).replace(':', '.')) : 'Ikke logget ind endnu') + ' · kode ' + esc(g.kode.slice(0, 4) + '-' + g.kode.slice(4)) + '</span></div>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap"><button type="button" class="ghost small" data-kopi="' + esc(g.pid) + '">Kopiér link</button>' + (navigator.share ? '<button type="button" class="ghost small" data-del="' + esc(g.pid) + '">Del</button>' : '') + '<button type="button" class="ghost small" data-ny="' + esc(g.pid) + '">Ny kode</button></div></div>';
  });
  h += '<div class="msg jf-msg" id="linkMsg" role="status"></div>';
  h += '<h3 class="jf-h">Ret programmet</h3><form class="jf-ret card jf-boks" id="progForm" novalidate>';
  const b = S.b, f = b.frist && b.frist.toDate ? b.frist.toDate() : null;
  const fdag = f ? f.getFullYear() + '-' + String(f.getMonth() + 1).padStart(2, '0') + '-' + String(f.getDate()).padStart(2, '0') : '';
  h += '<label for="rUnder">Underoverskrift</label><input id="rUnder" maxlength="120" value="' + esc(b.under || '') + '">';
  h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><label for="rFrist">Frist for padel</label><input type="date" id="rFrist" value="' + fdag + '"></div><div><label for="rPladser">Pladser til padel</label><input type="number" id="rPladser" min="1" max="40" value="' + (b.padelPladser || 8) + '"></div></div>';
  h += '<label for="rBetal">Betaling for padel</label><input id="rBetal" maxlength="200" value="' + esc(b.padelBetaling || '') + '">';
  h += '<label>Programmet</label><div id="rProg">' + (b.program || []).map((p, i) => progLinje(p, i)).join('') + '</div><button type="button" class="ghost small" id="rProgNy">+ Punkt</button>';
  h += '<label for="rMenuT">Menu</label><input id="rMenuT" maxlength="80" value="' + esc((b.menu || {}).titel || '') + '"><textarea id="rMenu" maxlength="600" rows="4" style="margin-top:6px">' + esc((b.menu || {}).tekst || '') + '</textarea>';
  h += '<button class="primary" style="width:100%;margin-top:14px">Gem programmet</button><div class="msg jf-msg" id="progMsg" role="status"></div></form>';
  h += '<h3 class="jf-h">Ændr en deltagers valg</h3><div class="card jf-boks jf-ret"><p class="jf-lille" style="margin-top:0">Også efter fristen. Deltageren og chatten får det at se.</p><select id="vPid">' + (b.deltagerIder || []).map((p) => '<option value="' + esc(p) + '">' + esc(navnPaa(p)) + ' · ' + esc(statusTekst(S.del[p])) + '</option>').join('') + '</select>' +
    '<div style="display:flex;gap:6px;margin-top:8px"><button type="button" class="ghost small" data-sv="padel">Padel og middag</button><button type="button" class="ghost small" data-sv="middag">Kun middag</button><button type="button" class="ghost small" data-sv="efter">Efter middagen</button></div><div class="msg jf-msg" id="svMsg" role="status"></div></div>';
  $('vis').innerHTML = h;
  const lm = $('linkMsg');
  const find = (pid) => S.gaester.find((g) => g.pid === pid);
  document.querySelectorAll('[data-kopi]').forEach((k) => k.addEventListener('click', async () => {
    const g = find(k.getAttribute('data-kopi'));
    const t = 'Hej ' + g.navn.split(' ')[0] + '. Her er dit link til julefrokosten: ' + linkTil(g.kode);
    try { await navigator.clipboard.writeText(t); lm.textContent = 'Linket til ' + g.navn + ' er kopieret med en kort hilsen. Sæt det ind i en privat besked.'; lm.className = 'msg okm jf-msg'; }
    catch (err) { prompt('Kopiér linket', linkTil(g.kode)); }
  }));
  document.querySelectorAll('[data-del]').forEach((k) => k.addEventListener('click', async () => {
    const g = find(k.getAttribute('data-del'));
    try { await navigator.share({ title: 'Julefrokost', text: 'Hej ' + g.navn.split(' ')[0] + '. Her er dit link til julefrokosten:', url: linkTil(g.kode) }); } catch (err) { /* annulleret */ }
  }));
  document.querySelectorAll('[data-ny]').forEach((k) => k.addEventListener('click', async () => {
    const g = find(k.getAttribute('data-ny'));
    if (!k.dataset.ok) { k.dataset.ok = '1'; k.textContent = 'Tryk igen: ' + g.navn.split(' ')[0] + ' logges ud'; return; }
    k.disabled = true;
    try { const r = await motor('jul', 'nyKode', { pid: g.pid }, nyId()); g.kode = r.kode; g.sidstInde = ''; tegnLinks(); $('linkMsg').textContent = g.navn + ' har fået en ny kode. Det gamle link virker ikke længere. Send det nye.'; $('linkMsg').className = 'msg okm jf-msg'; }
    catch (err) { lm.textContent = err.message; lm.className = 'msg err jf-msg'; k.disabled = false; }
  }));
  $('rProgNy').addEventListener('click', () => { const d = document.createElement('div'); d.innerHTML = progLinje({}, $('rProg').children.length); $('rProg').append(d.firstChild); bindProg(); });
  bindProg();
  $('progForm').addEventListener('input', () => { S.travlt = true; });
  $('progForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pm = $('progMsg'); pm.textContent = 'Gemmer …'; pm.className = 'msg jf-msg';
    const program = Array.from(document.querySelectorAll('.jf-prog')).map((r) => ({ kl: r.querySelector('[data-f=kl]').value, ikon: r.querySelector('[data-f=ikon]').value, titel: r.querySelector('[data-f=titel]').value, tekst: r.querySelector('[data-f=tekst]').value }));
    try {
      await motor('jul', 'program', { under: $('rUnder').value, frist: $('rFrist').value, padelPladser: Number($('rPladser').value), padelBetaling: $('rBetal').value, program, menu: { titel: $('rMenuT').value, tekst: $('rMenu').value } }, nyId());
      S.travlt = false; pm.textContent = 'Gemt. Alle ser det med det samme.'; pm.className = 'msg okm jf-msg';
    } catch (err) { pm.textContent = err.message; pm.className = 'msg err jf-msg'; }
  });
  document.querySelectorAll('[data-sv]').forEach((k) => k.addEventListener('click', async () => {
    const sm = $('svMsg'); sm.textContent = 'Gemmer …'; sm.className = 'msg jf-msg';
    try { await motor('jul', 'saetValg', { pid: $('vPid').value, valg: k.getAttribute('data-sv') }, nyId()); sm.textContent = 'Gemt.'; sm.className = 'msg okm jf-msg'; }
    catch (err) { sm.textContent = err.message; sm.className = 'msg err jf-msg'; }
  }));
}
function progLinje(p, i) {
  return '<div class="jf-prog"><input data-f="kl" maxlength="12" placeholder="Kl." aria-label="Klokken" value="' + esc(p.kl || '') + '"><input data-f="titel" maxlength="80" placeholder="Titel" aria-label="Titel" value="' + esc(p.titel || '') + '"><input data-f="ikon" maxlength="8" aria-label="Ikon" value="' + esc(p.ikon || '') + '">' +
    '<textarea data-f="tekst" maxlength="200" rows="1" placeholder="Sted og detaljer" aria-label="Sted og detaljer">' + esc(p.tekst || '') + '</textarea><button type="button" class="ghost small" data-fjernp aria-label="Fjern punktet">×</button></div>';
}
function bindProg() {
  document.querySelectorAll('[data-fjernp]').forEach((k) => { k.onclick = () => { k.closest('.jf-prog').remove(); S.travlt = true; }; });
}

// ---------- Log ud
async function logUd() {
  const jul = hent('rtk.jul.token');
  try { if (jul) await motor('kerne', 'logud', hent('rtk.jul.push') ? { pushId: hent('rtk.jul.push') } : {}); } catch (e) {}
  gem('rtk.jul.token', null); gem('rtk.jul.push', null); gem('rtk.jul.fb', null);
  history.replaceState(null, '', location.pathname + '#program');
  try { if (S.fb) await S.fb.auth.signOut(S.fb.au); } catch (e) {}
  S.lyt.forEach((x) => x()); S.lyt = []; S.bid = '';
  if (!jul) { location.href = '/'; return; }
  visLogin();
}

// ---------- Gå i gang: koden i linket (#k=ABCD2345) logger ind og fjernes fra adressen med det samme
const km = /[#&]k=([A-Za-z0-9-]{6,24})/.exec(location.hash);
if (km) logIndMedKode(km[1], null);
else if (KODE_URL && !hent('rtk.jul.token')) logIndMedKode(KODE_URL, null, true);
else { if (KODE_URL) S.kode = KODE_URL; start(false); }
$('filer').addEventListener('change', (e) => { laegOp(e).finally(() => { e.target.value = ''; }); });
window.RTK_JUL = S; // til test
})();
</script>
