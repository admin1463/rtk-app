<script>
// Privattimer for trænere og administrationen (personale/privattimer.html). Bygges ind af privattimer.py. 22. oktober 2026.
// Træneren: timer at kvittere, kommende timer, ledige tider (afstemningens ugestribe og tidspiller), forespørgsler med tidsforslag,
// måneden og trænerprofilen. Administrationen: betalinger fra MobilePay, tilbagebetalinger, løn og profiler.
// Mockup: kilder/mockup/privattraening_mockup.py. Beslutningerne står i BESLUTNINGER under "Privattræning".
const MILJOE = window.RTK_KONFIG.miljoe;
const URL_MOTOR = window.RTK_KONFIG.motor;
const $ = (id) => document.getElementById(id);
const gem = (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
const hent = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const nyId = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const kr = (n) => String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ' kr.';
const to = (n) => String(n).padStart(2, '0');
const UGE = ['søn.', 'man.', 'tir.', 'ons.', 'tor.', 'fre.', 'lør.'];
const UGE_L = ['Søndag', 'Mandag', 'Tirsdag', 'Onsdag', 'Torsdag', 'Fredag', 'Lørdag'];
const MD = ['jan.', 'feb.', 'mar.', 'apr.', 'maj', 'jun.', 'jul.', 'aug.', 'sep.', 'okt.', 'nov.', 'dec.'];
const MD_L = ['januar', 'februar', 'marts', 'april', 'maj', 'juni', 'juli', 'august', 'september', 'oktober', 'november', 'december'];
const kl = (ms) => { const d = new Date(ms); return to(d.getHours()) + '.' + to(d.getMinutes()); };
const dagTekst = (ms) => { const d = new Date(ms); return UGE[d.getDay()] + ' ' + d.getDate() + '. ' + MD[d.getMonth()]; };
const tidsrum = (a, b) => kl(a) + '–' + kl(b);
const naar = (a, b) => dagTekst(a) + ' kl. ' + tidsrum(a, b);
const varighed = (a, b) => { const m = Math.round((b - a) / 60000); return m % 60 ? m + ' min.' : m === 60 ? '1 time' : (m / 60) + ' timer'; };
const iso = (d) => d.getFullYear() + '-' + to(d.getMonth() + 1) + '-' + to(d.getDate());
const fraIso = (s, hm) => { const [y, m, d] = s.split('-').map(Number); const [h, mi] = (hm || '00:00').split(':').map(Number); return new Date(y, m - 1, d, h, mi); };
const SPORT = { tennis: 'Tennis', padel: 'Padel', begge: 'Tennis og padel' };
const MESTFOR = { begyndere: 'Begyndere', let: 'Let øvede', oevede: 'Øvede', konkurrence: 'Konkurrence', juniorer: 'Juniorer' };
const DAGE = { man: 'man', tir: 'tir', ons: 'ons', tor: 'tor', fre: 'fre', loer: 'lør', soen: 'søn' };
const TIDSP = { formiddag: 'formiddag', eftermiddag: 'eftermiddag', aften: 'aften' };
const ini = (navn) => String(navn || '').split(/\s+/).filter(Boolean).map((x) => x[0]).slice(0, 2).join('').toUpperCase();

let token = hent('rtk.token') || '';
let person = null;
const S = { tekst: {}, d: null, adm: null, adm_md: '', traad: {}, ed: null, aabn: null, profil: null, to: '', sender: false, csv: null };
if (MILJOE === 'test') $('testBanner').classList.remove('hidden');
window.RTK_TRAVL = false;

async function motor(modul, handling, data, id, forsoeg) {
  let res;
  try { res = await fetch(URL_MOTOR, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ modul, handling, data: data || {}, token, id: id || '' }) }); }
  catch (e) { throw new Error('Ingen forbindelse. Tjek net og prøv igen.'); }
  let svar;
  try { svar = await res.json(); } catch (e) { throw new Error('Ingen forbindelse. Tjek net og prøv igen.'); }
  // Telefonen kan lave kaldet om til en GET undervejs (iPhone 22. oktober). Motoren svarer igen: true, og kaldet sendes igen med samme id.
  if (!svar.ok && svar.igen && (forsoeg || 0) < 2) { await new Promise((ok) => setTimeout(ok, 500)); return motor(modul, handling, data, id, (forsoeg || 0) + 1); }
  if (!svar.ok) { if (svar.login) logUd(true); throw new Error(svar.fejl || 'Noget gik galt'); }
  return svar.data;
}
function logUd(udloebet) {
  // Kun én gang, når flere kald samtidig får 'Log ind igen' (den huskede person, 23. oktober)
  if (window.RTK_UD) return; window.RTK_UD = true;
  if (!udloebet && token) motor('kerne', 'logud').catch(() => {});
  token = ''; person = null; gem('rtk.token', null); gem('rtk.mig', null);
  // Firebase-login glemmes, før siden skifter (højst et sekund, gennemgangen V2)
  const ud = window.RTKV ? RTKV.logUd() : Promise.resolve();
  ud.then(() => location.replace(udloebet ? './?til=' + encodeURIComponent('privattimer.html' + location.hash) + '&igen=1' : './'));
}
$('logud').addEventListener('click', () => logUd(false));
function besked(el, t, s) { if (!el) return; el.textContent = t || ''; el.className = 'msg' + (s ? ' ' + s : ''); }
const msg = (t, s) => besked($('msg'), t, s);
const erAdmin = () => !!person && (person.roller || []).indexOf('admin') >= 0;
const erTraener = () => !!person && (person.roller || []).some((r) => r === 'admin' || r === 'traener' || r === 'cheftraener');

// ------------------------------------------------------------ start
// Personen huskes på telefonen, så siden går i gang med det samme, og motoren tjekker bagefter (Lars 23. oktober kl. 08.41: siderne var for langsomme)
function migHusket() { try { const m = JSON.parse(hent('rtk.mig') || 'null'); return m && token && m.t === token.slice(-16) ? m.p : null; } catch (e) { return null; } }
function migHent() { return motor('kerne', 'mig').then((p) => { gem('rtk.mig', JSON.stringify({ t: token.slice(-16), p: p })); return p; }); }
async function start() {
  if (!token) { location.replace('./?til=' + encodeURIComponent('privattimer.html' + location.hash)); return; }
  try {
    // Timerne hentes samtidig med personen, så siden kun venter på ét kald
    const tP = motor('privat', 'tStart').then((d) => ({ d }), (e) => ({ e }));
    const husket = migHusket();
    // Er rollerne ændret siden sidst (fx ikke længere administrator), genindlæses siden med de rigtige (gennemgangen V1)
    if (husket) { person = husket; migHent().then((p) => { if (JSON.stringify(p.roller || []) !== JSON.stringify(husket.roller || [])) location.reload(); }).catch(() => {}); } else person = await migHent();
    if (!erTraener()) { $('omraade').classList.remove('hidden'); $('hvem').textContent = 'Logget ind som ' + person.navn; $('vis').innerHTML = '<div class="pt-tom">Kun for trænere og administratorer.</div>'; return; }
    $('hvem').textContent = 'Logget ind som ' + person.navn;
    $('omraade').classList.remove('hidden');
    // Det, motoren sidst lagde i Firebase, vises med det samme. Svaret fra motoren og ændringer fra andre kommer bagefter (trin 1, 23. oktober)
    if (window.RTKV) {
      RTKV.lyt(motor, 'privatTraener', (d) => { if (nyD(d)) visNy(); });
      if (erAdmin()) RTKV.lyt(motor, 'privatAdmin', (a) => {
        if (S.adm_md && a.maaned !== S.adm_md) return;
        if (S.adm && S.adm.laest && a.laest && a.laest <= S.adm.laest) return;
        S.adm = a; S.adm_md = a.maaned;
        if (location.hash === '#adm' && !window.RTK_TRAVL && !S.sender) tegnAdm();
      });
    }
    if (!S.d) msg('Henter …');
    const r = await tP;
    if (r.e) { if (!S.d) throw r.e; return; }
    if (nyD(r.d)) visNy(); else if (msgTekst() === 'Henter …') msg('');
  } catch (err) { $('omraade').classList.remove('hidden'); msg(err.message, 'err'); }
}
/** Nye data fra Firebase eller motoren: kun hvis de er nyere end det, siden viser, og faktisk ændret. */
function nyD(d) {
  if (!d || typeof d !== 'object' || !Array.isArray(d.forespoergsler)) return false;
  if (S.d && S.d.laest && d.laest && d.laest < S.d.laest) return false;
  // Visningen i Firebase har ikke det store profilbillede: behold det, siden har (gennemgangen V5)
  if (d.billedeUdeladt) {
    d = Object.assign({}, d); delete d.billedeUdeladt;
    if (d.profil && S.d && S.d.profil && S.d.profil.billede) d.profil = Object.assign({}, d.profil, { billede: S.d.profil.billede });
  }
  if (S.d && udenLaest(S.d) === udenLaest(d)) return false;
  S.d = d;
  return true;
}
const udenLaest = (o) => JSON.stringify(o, (k, v) => (k === 'laest' ? undefined : v));
const msgTekst = () => ($('msg') ? $('msg').textContent : '');
/** Må siden tegnes igen nu? Ikke mens et felt har fokus, der skrives, eller der gemmes (gennemgangen M8). */
function kanTegne() {
  const a = document.activeElement;
  if (a && $('vis') && $('vis').contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return false;
  return !window.RTK_TRAVL && !S.sender;
}
function visNy() { if (msgTekst() === 'Henter …') msg(''); if (!S.vist || kanTegne()) { S.vist = true; tegn(); } }
let friskTid = 0;
async function frisk() {
  if (!S.d || Date.now() - friskTid < 4000) return;
  friskTid = Date.now();
  try { if (nyD(await motor('privat', 'tStart')) && !window.RTK_TRAVL) tegn(); } catch (e) { /* vises ved næste handling */ }
}
addEventListener('hashchange', () => { S.to = ''; S.ed = null; window.RTK_TRAVL = false; if (!S.sender) msg(''); tegn(); scrollTo(0, 0); frisk(); });
addEventListener('focus', frisk);

// ------------------------------------------------------------ byggeklodser
const hero = (h, kick) => '<div class="af-hero"><img src="../billeder/felt-privat.jpg" alt=""><div class="tx"><span class="kick">' + esc(kick) + '</span><h1>' + esc(h) + '</h1></div></div>';
const kal = (ms) => '<div class="af-kal"><span>' + esc(UGE[new Date(ms).getDay()].replace('.', '')) + '</span><b>' + new Date(ms).getDate() + '</b></div>';
const st = (x, slags) => '<span class="pt-st' + (slags ? ' ' + slags : '') + '">' + esc(x) + '</span>';
const sek = (x) => '<div class="pt-sek">' + esc(x) + '</div>';
const chips = (liste) => '<div class="af-info">' + liste.filter(Boolean).map(([x, pink]) => '<span' + (pink ? ' class="pink"' : '') + '>' + esc(x) + '</span>').join('') + '</div>';
const tilbage = (href, tekst) => '<a class="gr-tilbage" href="' + href + '">&#8592; ' + esc(tekst) + '</a>';
const bund = (b, s, knap, id, svag) => '<div class="af-bund"><div class="info"><b>' + esc(b) + '</b>' + esc(s) + '</div><button type="button" id="' + id + '"' + (svag ? ' class="svag"' : '') + '>' + esc(knap) + '</button></div>';
const personer = (b) => [b.spiller].concat(b.andre || []).join(' og ');
function faner(aktiv) {
  const F = [['', 'Timer'], ['aabn', 'Åbne tider'], ['foresp', 'Forespørgsler' + (S.d && S.d.forespoergsler.length ? ' · ' + S.d.forespoergsler.length : '')], ['maaned', 'Måneden'], ['profil', 'Min profil']];
  if (erAdmin()) F.push(['adm', 'Betalinger og løn']);
  return '<div class="tt-kat" role="tablist">' + F.map(([h, n]) => '<a role="tab" href="#' + h + '" class="af-chip info lille" style="border-radius:999px;min-height:40px;padding:6px 14px;font-size:14px;' + (h === aktiv ? 'background:var(--pink);color:#FFFFFF;border-color:var(--pink)' : '') + '" aria-selected="' + (h === aktiv) + '">' + esc(n) + '</a>').join('') + '</div>';
}
function vis(html) { $('vis').innerHTML = html; }
function betaltChip(b) { return b.betaltOk ? st('Betalt', 'ok') : b.betalt > 0 ? st('Delvist betalt', 'vent') : st('Ikke set betalt', 'vent'); }
/** Knap med to tryk. Første tryk viser konsekvensen, andet udfører (Lars' regel om farlige handlinger). */
function toTryk(id, nr, tekst1, tekst2, klasse) { return '<button type="button" class="af-chip ' + (klasse || 'farlig') + (S.to === id + nr ? ' fyldt' : '') + '" data-to="' + esc(id) + '" data-nr="' + esc(nr) + '">' + esc(S.to === id + nr ? tekst2 : tekst1) + '</button>'; }
function bindToTryk(fn) {
  document.querySelectorAll('[data-to]').forEach((b) => b.addEventListener('click', () => {
    const k = b.dataset.to + b.dataset.nr;
    if (S.to !== k) { S.to = k; tegn(); setTimeout(() => { if (S.to === k) { S.to = ''; tegn(); } }, 8000); return; }
    S.to = ''; fn(b.dataset.to, b.dataset.nr);
  }));
}
async function handling(navn, data, efter) {
  if (S.sender) return;
  S.sender = true; msg('Gemmer …');
  try { S.d = await motor('privat', navn, data, nyId()); msg(efter || 'Gemt', 'okm'); window.RTK_TRAVL = false; tegn(); }
  catch (err) { msg(err.message, 'err'); }
  finally { S.sender = false; }
}

// ------------------------------------------------------------ ruter
function tegn() {
  if (!S.d) return;
  const h = location.hash.replace(/^#/, '').split('/');
  if (h[0] === 'aabn') return tegnAabn();
  if (h[0] === 'foresp') return tegnForespListe();
  if (h[0] === 'f' && h[1]) return tegnForesp(h[1]);
  if (h[0] === 'b' && h[1]) return tegnBooking(h[1]);
  if (h[0] === 'maaned') return tegnMaaned();
  if (h[0] === 'profil') return tegnProfil();
  if (h[0] === 'adm' && erAdmin()) return tegnAdm();
  tegnTimer();
}

// ------------------------------------------------------------ timer
function timeRaekke(b, ekstra) {
  return '<a class="kl-r" href="#b/' + esc(b.nr) + '" style="text-decoration:none;color:inherit">' + kal(b.start) + '<div class="navn"><b>' + esc(tidsrum(b.start, b.slut)) + '</b><small>' +
    esc([personer(b), b.bane || 'bane ikke skrevet', b.nr, b.beskeder ? b.beskeder + (b.beskeder === 1 ? ' besked' : ' beskeder') : ''].filter(Boolean).join(' · ')) + '</small></div>' + (ekstra || betaltChip(b)) + '</a>';
}
function tegnTimer() {
  const d = S.d;
  let h = hero('Privattimer', 'Dit arbejde') + faner('');
  if (!d.til) h += '<div class="pt-tom" style="text-align:left">Medlemmerne kan ikke se dig endnu. Skriv din profil, og slå privattimer til under <a href="#profil" style="color:var(--pink);font-weight:700">Min profil</a>.</div>';
  if (d.forespoergsler.length) h += '<a class="af-bedst tom" href="#foresp" style="text-decoration:none;color:inherit;margin-top:14px"><div class="af-mid"><span class="kl" style="font-size:16px">' +
    d.forespoergsler.length + (d.forespoergsler.length === 1 ? ' forespørgsel' : ' forespørgsler') + '</span><span class="lg">Svar med nogle tider</span></div>' + st('Svar', 'vent') + '</a>';
  if (d.kvitter.length) {
    h += sek('Skal kvitteres');
    d.kvitter.forEach((b) => {
      h += '<div class="kl-boks">' + timeRaekke(b) +
        '<label class="pt-check"><input type="checkbox" data-vagt="' + esc(b.nr) + '"' + (hent('rtk.pt.vagt.' + b.nr) === '1' ? ' checked' : '') + '>I betalt vagttid, så kun tillæg på ' + esc(kr(100)) + '</label>' +
        '<div class="pt-knapper"><button type="button" class="af-chip fyldt bred" data-holdt="' + esc(b.nr) + '" style="justify-content:center;min-height:46px">Timen er holdt</button>' +
        toTryk('udeblev', b.nr, 'Udeblev', 'Tryk igen: der skal betales ' + kr(b.pris), 'info') + '</div></div>';
    });
  }
  h += sek('Kommende');
  h += d.kommende.length ? '<div class="kl-boks">' + d.kommende.map((b) => timeRaekke(b)).join('') + '</div>' : '<div class="pt-tom">Ingen aftalte privattimer.</div>';
  if (d.seneste.length) {
    const ST = { holdt: ['Holdt', 'ok'], udeblev: ['Udeblev', 'vent'], afbud: ['Afbud', ''], aflyst: ['Aflyst', 'fejl'] };
    h += sek('Seneste') + '<div class="kl-boks">' + d.seneste.map((b) => timeRaekke(b, st(...(ST[b.status] || [b.status, ''])))).join('') + '</div>';
  }
  vis(h);
  document.querySelectorAll('[data-vagt]').forEach((x) => x.addEventListener('change', () => gem('rtk.pt.vagt.' + x.dataset.vagt, x.checked ? '1' : null)));
  document.querySelectorAll('[data-holdt]').forEach((b) => b.addEventListener('click', () => {
    const nr = b.dataset.holdt;
    handling('tHoldt', { nr, vagttid: !!document.querySelector('[data-vagt="' + nr + '"]:checked') }, 'Timen er kvitteret');
  }));
  bindToTryk((hv, nr) => { if (hv === 'udeblev') handling('tUdeblev', { nr, vagttid: !!document.querySelector('[data-vagt="' + nr + '"]:checked') }, 'Udeblivelsen er registreret'); });
}

// ------------------------------------------------------------ en time
function alleB() { return S.d.kvitter.concat(S.d.kommende, S.d.seneste); }
function tegnBooking(nr) {
  const b = alleB().find((x) => x.nr === nr);
  if (!b) { vis(tilbage('#', 'Privattimer') + '<div class="pt-tom">Timen findes ikke her længere.</div>'); return; }
  const nu = Date.now();
  const ST = { aftalt: 'Aftalt', holdt: 'Holdt', udeblev: 'Udeblev', afbud: 'Afbud', aflyst: 'Aflyst' };
  let h = tilbage('#', 'Privattimer') + hero(personer(b), 'Privattime ' + b.nr + ' · ' + ST[b.status]) +
    '<div class="af-bedst" style="margin-bottom:10px">' + kal(b.start) + '<div class="af-mid"><span class="kl">' + esc(tidsrum(b.start, b.slut)) + '</span><span class="lg">' +
    esc([UGE_L[new Date(b.start).getDay()] + ' ' + new Date(b.start).getDate() + '. ' + MD_L[new Date(b.start).getMonth()], SPORT[b.sport] || b.sport, b.antal === 1 ? '1 person' : b.antal + ' personer'].join(' · ')) + '</span></div>' + (b.status === 'aftalt' ? betaltChip(b) : '') + '</div>' +
    chips([[b.bane ? b.bane : 'Bane ikke skrevet endnu', !b.bane], [kr(b.pris), 0], b.barnId ? ['Junior, forælderen booker', 0] : null, b.frafaldet ? ['Betalingen er frafaldet', 0] : null]);
  if (b.oenske) h += '<div class="pt-boble">' + esc(b.oenske) + '</div><p class="pt-af">' + esc(b.spiller) + '</p>';
  if (b.status === 'aftalt' && b.start > nu) {

// ------------------------------------------------------------ tidsvælgeren (afstemningens design B)
// E = { dage: { 'yyyy-mm-dd': [{ fra: '17:00', til: '18:00' }] }, sidste: { fra, til } }
function nyEditor() { return { dage: {}, sidste: { fra: '17:00', til: '18:00' }, anden: false }; }
function edTider(E) { return Object.keys(E.dage).sort().reduce((a, d) => a.concat(E.dage[d].map((x) => ({ dag: d, fra: x.fra, til: x.til }))), []); }
function edHtml(E, trin1, trin2) {
  const idag = new Date(); idag.setHours(12, 0, 0, 0);
  const dage = []; for (let i = 0; i < 14; i++) { const d = new Date(idag); d.setDate(d.getDate() + i); dage.push(iso(d)); }
  Object.keys(E.dage).forEach((d) => { if (dage.indexOf(d) < 0) dage.push(d); });
  dage.sort();
  let h = '<div class="af-trin"><span class="nr">1</span><h2>' + esc(trin1) + '</h2></div><div class="af-uge" id="edUge">' +
    dage.map((d, i) => { const x = fraIso(d); const v = !!E.dage[d]; return '<button type="button" class="af-dag' + (v ? ' valgt' : '') + '" data-dag="' + d + '" aria-pressed="' + v + '" aria-label="' + esc(UGE_L[x.getDay()] + ' ' + x.getDate() + '. ' + MD_L[x.getMonth()]) + '"><span>' + (d === iso(idag) ? 'i dag' : UGE[x.getDay()].replace('.', '')) + '</span><b>' + x.getDate() + '</b>' + (v ? '<i class="prik"></i>' : '') + '</button>'; }).join('') +
    '<button type="button" class="af-dag anden" id="edAnden"><span>anden</span><b>+</b><small>dato</small></button></div>';
  if (E.anden) h += '<div class="pt-skriv" style="margin-top:0"><input type="date" id="edDato" min="' + iso(new Date()) + '" aria-label="Anden dato"><button type="button" class="af-chip info" id="edDatoOk">Tilføj</button></div>';
  const T = Object.keys(E.dage).sort();
  h += '<div class="af-trin"><span class="nr">2</span><h2>' + esc(trin2) + '</h2></div>';
  if (!T.length) h += '<div class="pt-tom">Tryk på en dag ovenfor. Hver dag får en tid fra ' + esc(E.sidste.fra.replace(':', '.')) + ' til ' + esc(E.sidste.til.replace(':', '.')) + ', som du kan rette.</div>';
  T.forEach((d) => {
    const x = fraIso(d);
    E.dage[d].forEach((tt, i) => {
      h += '<div class="pt-raekke"><div class="d">' + (i === 0 ? esc(UGE_L[x.getDay()]) + '<small>' + x.getDate() + '. ' + MD[x.getMonth()] + '</small>' : '') + '</div>' +
        '<input type="time" step="900" value="' + tt.fra + '" data-ed="fra" data-d="' + d + '" data-i="' + i + '" aria-label="Fra, ' + esc(UGE_L[x.getDay()]) + '">' +
        '<input type="time" step="900" value="' + tt.til + '" data-ed="til" data-d="' + d + '" data-i="' + i + '" aria-label="Til, ' + esc(UGE_L[x.getDay()]) + '">' +
        '<button type="button" class="x" data-edx="' + d + '" data-i="' + i + '" aria-label="Fjern tiden">×</button></div>';
    });
  });
  if (T.length) h += '<button type="button" class="af-chip" id="edMere" style="margin:4px 0 0">+ En tid mere</button>';
  return h;
}
function edBind(E, gentegn) {
  document.querySelectorAll('#edUge [data-dag]').forEach((b) => b.addEventListener('click', () => {
    const d = b.dataset.dag;
    if (E.dage[d]) delete E.dage[d]; else E.dage[d] = [{ fra: E.sidste.fra, til: E.sidste.til }];
    window.RTK_TRAVL = true; gentegn();
  }));
  $('edAnden').addEventListener('click', () => { E.anden = !E.anden; gentegn(); });
  if ($('edDatoOk')) $('edDatoOk').addEventListener('click', () => { const v = $('edDato').value; if (v && !E.dage[v]) E.dage[v] = [{ fra: E.sidste.fra, til: E.sidste.til }]; E.anden = false; window.RTK_TRAVL = true; gentegn(); });
  document.querySelectorAll('[data-ed]').forEach((x) => x.addEventListener('change', () => {
    const r = E.dage[x.dataset.d][Number(x.dataset.i)];
    const gl = { fra: r.fra, til: r.til };
    r[x.dataset.ed] = x.value || r[x.dataset.ed];
    // Flyttes "fra", følger "til" med, så længden holdes
    if (x.dataset.ed === 'fra') { const l = (fraIso('2000-01-01', gl.til) - fraIso('2000-01-01', gl.fra)); const ny = new Date(fraIso('2000-01-01', r.fra).getTime() + (l > 0 ? l : 3600000)); r.til = to(ny.getHours()) + ':' + to(ny.getMinutes()); }
    E.sidste = { fra: r.fra, til: r.til }; window.RTK_TRAVL = true; gentegn();
  }));
  document.querySelectorAll('[data-edx]').forEach((b) => b.addEventListener('click', () => {
    const d = b.dataset.edx; E.dage[d].splice(Number(b.dataset.i), 1); if (!E.dage[d].length) delete E.dage[d]; gentegn();
  }));
  if ($('edMere')) $('edMere').addEventListener('click', () => {
    const T = Object.keys(E.dage).sort(); const d = T[T.length - 1]; const s = E.dage[d][E.dage[d].length - 1];
    const l = fraIso('2000-01-01', s.til) - fraIso('2000-01-01', s.fra);
    const til = new Date(fraIso('2000-01-01', s.til).getTime() + (l > 0 ? l : 3600000));
    E.dage[d].push({ fra: s.til, til: to(til.getHours()) + ':' + to(til.getMinutes()) }); window.RTK_TRAVL = true; gentegn();
  });
}
/** Tiderne som millisekunder. Over midnat eller "til" før "fra" afvises her, så fejlen står ved feltet. */
function edMs(E, uger) {
  const ud = [];
  edTider(E).forEach((x) => {
    for (let w = 0; w <= (uger || 0); w++) {
      const s = fraIso(x.dag, x.fra); s.setDate(s.getDate() + 7 * w);
      const e = fraIso(x.dag, x.til); e.setDate(e.getDate() + 7 * w);
      if (e <= s) throw new Error('Tiden ' + dagTekst(s.getTime()) + ' ' + x.fra.replace(':', '.') + ' slutter, før den begynder');
      ud.push({ start: s.getTime(), slut: e.getTime() });
    }
  });
  return ud;
}

/** Billedet gøres lille i browseren: et stort (højst 720 punkter) og et lille kvadratisk (96 punkter) som JPEG. */
function lavBilleder(fil) {
  return new Promise((ok, nej) => {
    if (!/^image\//.test(fil.type)) return nej(new Error('Vælg et billede'));
    const url = URL.createObjectURL(fil);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const tegn = (w, h, sx, sy, sw, sh, max) => {
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
        for (let q = 0.85; q >= 0.4; q -= 0.1) { const d = c.toDataURL('image/jpeg', q); if (d.length <= max) return d; }
        throw new Error('Billedet er for stort. Vælg et andet.');
      };
      try {
        const sk = Math.min(1, 720 / Math.max(img.width, img.height));
        const stor = tegn(Math.round(img.width * sk), Math.round(img.height * sk), 0, 0, img.width, img.height, 390000);
        const k = Math.min(img.width, img.height);
        const mini = tegn(96, 96, (img.width - k) / 2, (img.height - k) / 2, k, k, 19000);
        ok({ stor, mini });
      } catch (e) { nej(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); nej(new Error('Billedet kan ikke læses. Vælg et andet.')); };
    img.src = url;
  });
}

/** Transaktionslisten som CSV: semikolon, komma eller tabulator, med overskrifter. Kolonnerne findes på navnet. */
function laesCsv(tekst) {
  tekst = String(tekst).replace(/^﻿/, '');
  const foerste = tekst.split(/\r?\n/)[0] || '';
  const sep = [';', '\t', ','].sort((a, b) => foerste.split(b).length - foerste.split(a).length)[0];
  const rk = []; let felt = '', linje = [], i = 0, cit = false;
  for (; i < tekst.length; i++) {
    const c = tekst[i];
    if (cit) { if (c === '"' && tekst[i + 1] === '"') { felt += '"'; i++; } else if (c === '"') cit = false; else felt += c; continue; }
    if (c === '"') cit = true; else if (c === sep) { linje.push(felt); felt = ''; } else if (c === '\n' || c === '\r') { if (c === '\r' && tekst[i + 1] === '\n') i++; linje.push(felt); rk.push(linje); linje = []; felt = ''; } else felt += c;
  }
  if (felt || linje.length) { linje.push(felt); rk.push(linje); }
  const hoved = (rk.shift() || []).map((x) => x.trim().toLowerCase());
  const find = (...ord) => hoved.findIndex((h) => ord.some((o) => h.indexOf(o) >= 0));
  const iB = find('beløb', 'belob', 'amount'), iM = find('besked', 'message', 'kommentar', 'comment', 'tekst', 'note'), iN = find('navn', 'name', 'afsender', 'kunde'), iT = find('dato', 'date', 'tidspunkt', 'tid', 'time'), iI = find('transaktions-id', 'transaktion', 'transaction', 'reference', 'id');
  if (iB < 0 || iM < 0) throw new Error('Filen mangler kolonnerne beløb og besked. Send filen til klubbens systemansvarlige, så kan formatet læses.');
  return rk.filter((r) => r.length > 1 && r[iB] && r[iB].trim()).map((r) => ({ beloeb: r[iB].trim(), besked: r[iM] || '', navn: iN >= 0 ? r[iN] : '', tid: iT >= 0 ? r[iT] : '', id: iI >= 0 && iI !== iB ? r[iI] : '' }));
}
