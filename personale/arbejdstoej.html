<script>
// Arbejdstøj og udstyr (personale/arbejdstoej.html). Bygges ind af arbejdstoej.py. 16. oktober 2026.
// Trænerens kurv, hele katalogsiden, sko og størrelse, og for administratorerne kontoen, varerne, personerne,
// nye tildelinger, godkendelse og ordren til Carsten. Mockup: kilder/mockup/arbejdstoej_mockup.py.
const MILJOE = window.RTK_KONFIG.miljoe;
const URL_MOTOR = window.RTK_KONFIG.motor;
const $ = (id) => document.getElementById(id);
const gem = (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
const hent = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const nyId = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const kr = (n) => String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ' kr.';
const BIL = '../billeder/toej/';
const MD = ['jan.', 'feb.', 'mar.', 'apr.', 'maj', 'jun.', 'jul.', 'aug.', 'sep.', 'okt.', 'nov.', 'dec.'];
const UGE = ['søn.', 'man.', 'tir.', 'ons.', 'tor.', 'fre.', 'lør.'];
const dagTekst = (iso) => { if (!iso) return ''; const d = new Date(String(iso).slice(0, 10) + 'T12:00:00'); return UGE[d.getDay()] + ' ' + d.getDate() + '. ' + MD[d.getMonth()]; };
const tidTekst = (s) => { if (!s) return ''; const d = new Date(String(s).replace(' ', 'T')); return dagTekst(String(s).slice(0, 10)) + ' kl. ' + String(d.getHours()).padStart(2, '0') + '.' + String(d.getMinutes()).padStart(2, '0'); };
const STATUS = { aaben: ['I gang', 'n'], sendt: ['Venter på godkendelse', 'v'], godkendt: ['Godkendt', 'ok'], bestilt: ['Bestilt', 'ok'], leveret: ['Kan hentes', 'ok'], udleveret: ['Modtaget', 'ok'], bortfaldet: ['Bortfaldet', 'n'], annulleret: ['Annulleret', 'n'] };
const KAT_NAVN = { primaer: 'Primære trænere', time: 'Timetrænere', oevrig: 'Øvrige' };

let token = hent('rtk.token') || '';
let person = null;
const S = { som: null, start: null, adm: null, varerAdm: null, kladde: {}, gemmer: {}, venter: {}, str: {}, kat: 'toej', model: hent('rtk.toej.model') || 'alle', cm: '', fejl: '' };
if (MILJOE === 'test') $('testBanner').classList.remove('hidden');

async function motor(modul, handling, data, id) {
  let res;
  try { res = await fetch(URL_MOTOR, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ modul, handling, data: data || {}, token, id: id || '' }) }); }
  catch (e) { throw new Error('Ingen forbindelse. Tjek net og prøv igen.'); }
  const svar = await res.json();
  if (!svar.ok) { if (svar.login) logUd(true); throw new Error(svar.fejl || 'Noget gik galt'); }
  return svar.data;
}
function logUd(udloebet) {
  if (!udloebet && token) motor('kerne', 'logud').catch(() => {});
  token = ''; person = null; gem('rtk.token', null);
  location.replace(udloebet ? './?til=arbejdstoej.html&igen=1' : './');
}
$('logud').addEventListener('click', () => logUd(false));
function besked(el, t, s) { if (!el) return; el.textContent = t || ''; el.className = 'msg' + (s ? ' ' + s : ''); }
window.RTK_TRAVL = false;

// ------------------------------------------------------------ data
const vareMap = () => { const m = {}; (S.start ? S.start.varer : []).forEach((v) => { m[v.id] = v; }); if (S.varerAdm) S.varerAdm.varer.forEach((v) => { m[v.id] = m[v.id] || v; }); return m; };
const tildeling = (tid) => (S.start ? S.start.tildelinger.find((t) => t.id === tid) : null);
const laaste = (t) => t.linjer.filter((l) => l.status === 'bestilt' || l.status === 'leveret');
function kladde(t) {
  if (!S.kladde[t.id]) S.kladde[t.id] = t.linjer.filter((l) => l.status === 'valgt').map((l) => ({ v: l.v, s: l.s, n: l.n }));
  return S.kladde[t.id];
}
function valgtSum(t) {
  const vm = vareMap();
  return laaste(t).reduce((a, l) => a + l.pris * l.n, 0) + kladde(t).reduce((a, l) => a + (vm[l.v] ? vm[l.v].pris * l.n : 0), 0);
}
function antalI(t, vid, s) { const l = kladde(t).find((x) => x.v === vid && x.s === s); return l ? l.n : 0; }
/** Den størrelse, knapperne arbejder på: den valgte, den eneste eller den, der allerede ligger i kurven */
function strFor(t, v) { if (S.str[v.id]) return S.str[v.id]; if (v.str.length === 1) return v.str[0]; const l = kladde(t).find((x) => x.v === v.id); return l ? l.s : ''; }
function antalVare(t, vid) { return kladde(t).filter((x) => x.v === vid).reduce((a, l) => a + l.n, 0); }
/** Pakken: hvilke pladser er fyldt, og må varen lægges i? */
function pakkePladser(t) {
  const vm = vareMap();
  const brugt = t.pakke.pladser.map(() => 0);
  laaste(t).concat(kladde(t)).forEach((l) => { const v = vm[l.v]; if (!v) return; for (let i = 0; i < l.n; i++) { const j = t.pakke.pladser.findIndex((p, x) => !brugt[x] && p.slags.indexOf(v.slags) >= 0); if (j >= 0) brugt[j] = 1; } });
  return brugt;
}
function kanTilfoeje(t, v) {
  if (t.type === 'pakke') { const b = pakkePladser(t); return t.pakke.pladser.some((p, i) => !b[i] && p.slags.indexOf(v.slags) >= 0); }
  return valgtSum(t) + v.pris <= t.beloeb;
}

// ------------------------------------------------------------ gem kurven (det sidste tryk gælder)
function aendr(t, vid, s, delta) {
  const k = kladde(t);
  let l = k.find((x) => x.v === vid && x.s === s);
  if (!l) { l = { v: vid, s, n: 0 }; k.push(l); }
  l.n = Math.max(0, Math.min(10, l.n + delta));
  S.kladde[t.id] = k.filter((x) => x.n > 0);
  if (S.som) { tegn(); return; } // Se som træner: kurven lever kun her og gemmes ikke
  S.venter[t.id] = true;
  tegn();
  gemKurv(t.id);
}
async function gemKurv(tid) {
  if (S.gemmer[tid]) return;
  S.gemmer[tid] = true;
  while (S.venter[tid]) {
    S.venter[tid] = false;
    try {
      const ny = await motor('toej', 'kurv', { tid, linjer: egneKladder()[tid] || [] }, nyId());
      if (!S.som) opdaterT(ny);
      if (!S.venter[tid]) egneKladder()[tid] = null;
      S.fejl = '';
    } catch (err) {
      S.fejl = err.message; egneKladder()[tid] = null; S.venter[tid] = false;
      try { await hentStart(); } catch (e) {}
    }
  }
  S.gemmer[tid] = false;
  tegn();
}
function opdaterT(ny) {
  const i = S.start.tildelinger.findIndex((t) => t.id === ny.id);
  if (i >= 0) S.start.tildelinger[i] = ny;
}
// Under "Se som træner" må et svar, der kommer sent, ikke overskrive trænerens data: det gemmes til, når man lukker
async function hentStart() { const s = await motor('toej', 'start'); if (S.som) S.som.egen = s; else S.start = s; }
const egneKladder = () => (S.som ? S.egenKladde || {} : S.kladde);
async function hentAdm() { S.adm = await motor('toej', 'oversigt'); }

// ------------------------------------------------------------ fælles stumper
const hero = (kick, h) => '<div class="af-hero"><img src="../billeder/felt-fordele.jpg" alt=""><div class="tx"><span class="kick">' + esc(kick) + '</span><h1>' + esc(h) + '</h1></div></div>';
const trin = (nr, h, hint) => '<div class="af-trin"><span class="nr">' + nr + '</span><h2>' + esc(h) + '</h2>' + (hint ? '<span class="hint">' + esc(hint) + '</span>' : '') + '</div>';
const chip = (t, valgt, attr, kl) => '<button type="button" class="af-chip' + (valgt ? ' valgt' : '') + (kl ? ' ' + kl : '') + '"' + (valgt === null ? '' : ' aria-pressed="' + !!valgt + '"') + ' ' + (attr || '') + '>' + t + '</button>';
const info = (t) => '<span class="af-chip info">' + t + '</span>';
const prik = (farve) => (/sodalite/i.test(farve) ? '<i class="tt-prik" aria-hidden="true"></i>' : '');
const bund = (b, lille, knap, attr) => '<div class="af-bund"><div class="info"><b>' + b + '</b>' + (lille || '') + '</div>' + (knap ? '<button type="button" ' + (attr || '') + '>' + knap + '</button>' : '') + '</div>';
const tilbage = (href, t) => '<a class="gr-tilbage" href="' + href + '">&#8592; ' + esc(t) + '</a>';
function vis(html) {
  // En kvittering fra handlingen før (fx efter en ny tildeling) vises øverst på næste skærm
  if (S.flash && S.flashH === location.hash) html = '<div class="msg okm" role="status">' + esc(S.flash) + '</div>' + html;
  if (S.som) html = '<div class="tt-som"><div><b>' + esc(S.som.titel) + '</b><span>' + esc(S.som.under) + '</span></div><button type="button" class="x" id="somLuk" aria-label="Luk forhåndsvisningen">Luk</button></div>' + html;
  $('vis').innerHTML = html;
}

// ------------------------------------------------------------ træneren
function vStart() {
  const ts = S.start.tildelinger;
  let h = hero('Fra klubben', 'Arbejdstøj og udstyr');
  if (S.start.admin) {
    const venter = S.adm ? S.adm.tildelinger.filter((t) => t.status === 'sendt').length : 0;
    h += '<div class="af-chips">' + chip('Kontoen', null, 'data-gaa="#konto"') + chip('Til godkendelse' + (venter ? ' (' + venter + ')' : ''), null, 'data-gaa="#godkend"') +
      chip('Personer', null, 'data-gaa="#personer"') + chip('Varerne', null, 'data-gaa="#varer"') + chip('+ Ny tildeling', null, 'data-gaa="#giv"') + '</div>';
  }
  if (!ts.length) {
    h += '<div class="gr-tom tt-tom"><b>Du har ingen tildeling lige nu</b><span>Når klubben giver dig arbejdstøj, får du en sms, og så kan du vælge her.</span></div>';
    return vis(h);
  }
  h += trin(1, 'Dine tildelinger');
  ts.forEach((t) => {
    const st = STATUS[t.status] || [t.status, 'n'];
    const hvad = t.type === 'pakke' ? t.pakke.navn : kr(t.beloeb) + ' at vælge for';
    const link = t.status === 'aaben' ? '#t/' + t.id : '#kurv/' + t.id;
    h += '<a class="tt-tr" href="' + link + '"><div class="tt-mid"><b>' + esc(hvad) + '</b><span>' +
      (t.status === 'aaben' ? 'Frist ' + esc(dagTekst(t.forlaenget || t.frist)) + (t.linjer.length ? ' · valgt ' + kr(valgtSum(t)) : '') : 'Valgt ' + kr(t.valgt)) +
      '</span></div><span class="tt-st ' + st[1] + '">' + esc(st[0]) + '</span></a>';
  });
  vis(h);
}

function vareKort(t, v, i) {
  const n = antalVare(t, v.id);
  const valgt = strFor(t, v);
  const sko = v.slags === 'sko';
  const tabel = sko ? S.start.sko[v.model === 'dame' ? 'dame' : 'herre'] : null;
  const strKnapper = v.str.map((s) => {
    const nI = antalI(t, v.id, s);
    let lbl = esc(s);
    if (sko) { const j = tabel.uk.indexOf(s); lbl = 'UK ' + esc(s.replace('.', ',')) + '<span>EU ' + esc(j >= 0 ? tabel.eu[j] : '') + '</span>'; }
    return '<button type="button" class="' + (s === valgt ? 'valgt' : '') + (sko ? ' sko' : '') + '" aria-pressed="' + (s === valgt) + '" data-str="' + esc(s) + '" data-v="' + esc(v.id) + '" aria-label="Størrelse ' + esc(sko ? 'UK ' + s : s) + (nI ? ', ' + nI + ' valgt' : '') + '">' + lbl + (nI ? '<em>' + nI + '</em>' : '') + '</button>';
  }).join('');
  const kan = kanTilfoeje(t, v) && !(S.som && S.som.laes);
  const nValgt = valgt ? antalI(t, v.id, valgt) : 0;
  return '<div class="tt-vare' + (n ? ' i' : '') + '" id="v' + i + '"><div class="tt-bil">' + (v.bil ? '<img src="' + BIL + esc(v.bil) + '" alt="" loading="lazy">' : '') + '</div>' +
    '<div class="tt-mid"><b>' + esc(v.navn) + '</b><span>' + prik(v.farve) + esc(v.farve) + ' · ' + esc(v.model) + '</span>' +
    (v.side ? '<a class="tt-kat-l" href="#side/' + v.side + '/' + encodeURIComponent(v.id) + '">Se hele siden</a>' : '') + '</div>' +
    '<div class="tt-pris">' + kr(v.pris) + '</div>' +
    '<div class="tt-step">' + (nValgt && !(S.som && S.som.laes) ? '<button type="button" class="tt-minus" data-minus="' + esc(v.id) + '" aria-label="Fjern en ' + esc(v.navn) + ' i ' + esc(valgt) + '">−</button><output aria-live="polite">' + nValgt + '</output>' : '') +
    '<button type="button" class="tt-plus' + (nValgt ? ' fyldt' : '') + '" data-plus="' + esc(v.id) + '"' + (kan ? '' : ' disabled') + ' aria-label="Læg en ' + esc(v.navn) + ' i kurven">+</button></div>' +
    '<div class="tt-str" role="group" aria-label="Størrelse">' + strKnapper + '</div></div>';
}

function skoGuide() {
  const m = S.model === 'dame' ? 'dame' : 'herre';
  const tab = S.start.sko[m];
  const cm = Number(String(S.cm).replace(',', '.'));
  let forslag = '';
  if (cm >= 15 && cm <= 35) {
    const j = tab.cm.findIndex((c) => c >= cm - 0.001);
    forslag = j < 0 ? 'Din fod er længere end Babolats tabel. Prøv skoen hos Racketlife.' : 'UK ' + tab.uk[j].replace('.', ',') + ' · EU ' + tab.eu[j];
  }
  return '<details class="af-mere tt-guide"' + (S.cm ? ' open' : '') + '><summary>Find din størrelse</summary><div class="ind">' +
    '<label for="cm">Mål din fod i cm (' + (m === 'dame' ? 'dame' : 'herre') + ')</label><input id="cm" inputmode="decimal" value="' + esc(S.cm) + '" placeholder="fx 27,0">' +
    (forslag ? '<div class="af-preview" style="margin-top:10px"><span class="k">Forslag efter Babolats tabel</span><b>' + esc(forslag) + '</b><span class="hint">Ligger du mellem to, så tag den største.</span></div>' : '') +
    '<p class="hint" style="margin:10px 0 0"><b>Sådan måler du:</b> stil dig på et stykke papir med hælen mod en væg, om aftenen og med den strømpe, du spiller i. Sæt et mærke ved den længste tå, og mål fra væggen. Mål begge fødder, og brug den længste.</p>' +
    '<div class="card tt-tabel">' + tab.uk.map((u, j) => '<div class="tt-post"><div>UK ' + esc(u.replace('.', ',')) + '<span>EU ' + esc(tab.eu[j]) + '</span></div><b>' + String(tab.cm[j]).replace('.', ',') + ' cm</b></div>').join('') + '</div>' +
    '<p class="hint">Babolats tabel, katalog 2027 side 59. <a href="#side/59">Se siden</a></p></div></details>' +
    '<div class="tt-regel"><b>Prøv skoen først.</b> Sko kan ikke byttes, ligesom tøjet. Prøv modellen og størrelsen hos Racketlife, <a href="https://maps.google.com/?q=%C3%85boulevard+15,+1960+Frederiksberg" target="_blank" rel="noopener">Åboulevard 15, 1960 Frederiksberg</a>, før du vælger. Har du en Babolat-sko i forvejen, så vælg samme størrelse. Til brede fødder findes Jet Mach 4 og Propulse Storm i en wide-udgave.</div>';
}

function vVaelg(tid) {
  const t = tildeling(tid);
  if (!t) return vIkke();
  if (t.status !== 'aaben' && !(S.som && S.som.laes)) { location.replace('#kurv/' + tid); return; }
  window.RTK_TRAVL = true;
  const varer = S.start.varer.filter((v) => v.til !== false);
  const pakke = t.type === 'pakke';
  let h = (S.som ? tilbage('#kurv/' + t.id, 'Kurven') : tilbage('#', 'Dine tildelinger')) + hero('Din tildeling · fra klubben', pakke ? 'Dit arbejdstøj' : 'Vælg dit arbejdstøj');
  h += '<div class="af-chips">' + info(pakke ? esc(t.pakke.navn) : kr(t.beloeb) + ' at vælge for') + info('Frist ' + esc(dagTekst(t.forlaenget || t.frist))) + '</div>';
  if (t.besked) h += '<div class="tt-regel ny" role="status">' + esc(t.besked) + '</div>';
  if (S.fejl) h += '<div class="tt-regel fejl" role="alert">' + esc(S.fejl) + '</div>';
  h += '<div class="tt-regel"><b>Størrelsen skal passe</b>, tøjet kan ikke byttes. Prøv prøvesættet ved pro shoppen.</div>';
  // Kategorier: tøj, sko og tilbehør, eller pakkens pladser
  let kats;
  if (pakke) kats = t.pakke.pladser.map((p, i) => ({ id: 'p' + i, navn: p.titel, fn: (v) => p.slags.indexOf(v.slags) >= 0 }));
  else kats = [{ id: 'toej', navn: 'Tøj', fn: (v) => v.slags !== 'sko' && v.gruppe !== 'tilbehoer' }, { id: 'sko', navn: 'Sko', fn: (v) => v.slags === 'sko' }, { id: 'tilbehoer', navn: 'Tilbehør', fn: (v) => v.gruppe === 'tilbehoer' }];
  kats = kats.filter((k) => varer.some(k.fn));
  if (!kats.find((k) => k.id === S.kat)) S.kat = kats.length ? kats[0].id : '';
  const kat = kats.find((k) => k.id === S.kat);
  h += trin(1, pakke ? 'Vælg størrelse' : 'Vælg varer', pakke ? 'klubben giver en T-shirt og en hættetrøje eller jakke' : 'priserne er Babolats listepriser');
  h += '<div class="tt-kat" role="group" aria-label="Kategori">' + kats.map((k) => '<button type="button" data-kat="' + k.id + '" aria-pressed="' + (k.id === S.kat) + '" class="' + (k.id === S.kat ? 'valgt' : '') + '">' + esc(k.navn) + '</button>').join('') + '</div>';
  h += '<div class="tt-kat tt-model" role="group" aria-label="Model">' + [['alle', 'Alle'], ['herre', 'Herre'], ['dame', 'Dame']].map((m) => '<button type="button" data-model="' + m[0] + '" aria-pressed="' + (S.model === m[0]) + '" class="' + (S.model === m[0] ? 'valgt' : '') + '">' + m[1] + '</button>').join('') + '</div>';
  if (S.kat === 'sko') h += skoGuide();
  const liste = varer.filter((v) => kat && kat.fn(v) && (S.model === 'alle' || v.model === S.model || v.model === 'unisex'));

  h += '<p class="tt-lbl" id="betL">Hvem betaler</p><div class="af-chips" role="group" aria-labelledby="betL">' + Object.keys(o.betalere).map((b) => chip(esc(o.betalere[b]), giv.betaler === b, 'data-betaler="' + b + '"')).join('') + '</div>';
  if (giv.type === 'frit') {
    h += '<label for="beloeb">Beløb i listepris inkl. moms</label><input id="beloeb" inputmode="numeric" value="' + esc(giv.beloeb) + '">';
    if (kat && kat.forslag && kat.forslag.beloeb) h += '<p class="hint" style="margin:4px 0 0">Forslag for ' + esc(kat.navn.toLowerCase()) + ': ' + kr(kat.forslag.beloeb) + '. Ret det frit.</p>';
  } else {
    const pk = o.pakker.find((p) => p.id === giv.pakke) || o.pakker[0];

  }
  h += '<label for="frist">Svar senest</label><input id="frist" type="date" value="' + esc(giv.frist) + '">';
  h += '<p class="hint" style="margin:4px 0 0">Sms og notifikation nu og hver uge, til der er bestilt. Ny sms dagen før fristen. Er der ikke bestilt, forlænges fristen kort, og så bortfalder tildelingen. Ubrugt beløb går tabt.</p>';
  h += '<details class="af-mere"><summary>Mere: grund</summary><div class="ind"><label for="grund">Grund (kun for administratorer)</label><input id="grund" maxlength="200" value="' + esc(giv.grund) + '"></div></details>';
  const beloebTekst = giv.type === 'frit' ? kr(Number(String(giv.beloeb).replace(/\./g, '')) || 0) : (o.pakker.find((p) => p.id === giv.pakke) || {}).navn;
  if (forste) h += '<div class="af-preview"><span class="k">Sådan ser ' + esc(forste.navn.replace(/^Test /, '').split(' ')[0]) + ' det</span><b>' + (giv.type === 'frit' ? 'Du kan vælge arbejdstøj for ' + esc(beloebTekst) : 'Du kan vælge ' + esc(String(beloebTekst).toLowerCase())) + '</b><span class="hint">Frist ' + esc(dagTekst(giv.frist)) + '</span><div class="af-chips">' + chip('Se hele ' + esc(fornavn(forste.navn)) + 's skærm', null, 'data-somgiv="1"', 'fyldt') + '</div><span class="hint">Med de varer, der er slået til lige nu. Intet gemmes, og der sendes ingen sms.</span></div>';
  h += '<div id="givMsg" class="msg" aria-live="polite"></div>';
  const ialt = giv.type === 'frit' ? (Number(String(giv.beloeb).replace(/\./g, '')) || 0) * giv.pids.length : 0;
  h += bund(giv.betaler === 'konto' ? (ialt ? kr(ialt) + ' fra kontoen' : giv.pids.length + ' valgt') : esc(o.betalere[giv.betaler] || ''), giv.betaler === 'konto' ? kr(o.konto.tilbage - o.konto.lovet - ialt) + ' tilbage bagefter, når de givne er brugt' : 'Rører ikke kontoen', 'Giv tildelingen', 'id="givKnap"' + (giv.pids.length ? '' : ' class="svag" disabled'));
  vis(h);
}

async function vVarer() {
  if (!S.varerAdm) { vis(tilbage('#konto', 'Kontoen') + '<p class="hint">Henter …</p>'); try { S.varerAdm = await motor('toej', 'varer'); } catch (err) { vis('<p class="msg err">' + esc(err.message) + '</p>'); return; } }
  const a = S.varerAdm;
  const tilAntal = a.varer.filter((v) => v.til).length;
  let h = tilbage('#konto', 'Kontoen') + hero('Kontoen · prislisten FW26', 'Varerne');
  h += '<div class="af-chips">' + info(tilAntal + ' af ' + a.varer.length + ' slået til') + '</div>';
  h += '<div class="af-preview"><span class="k">Se som træner</span><b>Sådan ser trænerne varerne lige nu</b><div class="af-chips">' + chip('Frit valg for 8.500 kr.', null, 'data-somvis="frit"', 'fyldt') + chip('Pakken til timetrænere', null, 'data-somvis="pakke"') + '</div><span class="hint">Med de varer, der er slået til. Intet gemmes.</span></div>';
  h += trin(1, 'Grupper', 'slå en hel gruppe til eller fra');
  a.grupper.forEach((g) => {
    const vs = a.varer.filter((v) => v.gruppe === g.id);
    const n = vs.filter((v) => v.til).length;
    h += '<div class="tt-gruppe-r"><button type="button" role="switch" class="vippe" aria-checked="' + (n > 0) + '" aria-label="' + esc(g.navn) + ' til eller fra" data-gruppe="' + g.id + '" data-til="' + (n > 0 ? 'nej' : 'ja') + '"></button><details class="af-mere tt-gruppe"><summary><span class="tt-mid"><b>' + esc(g.navn) + '</b><span>' + n + ' af ' + vs.length + '</span></span></summary><div class="ind">' +
      vs.map((v) => '<div class="tt-post"><div>' + esc(v.navn) + ' · ' + esc(v.model) + '<span>' + prik(v.farve) + esc(v.farve) + ' · ' + kr(v.pris) + ' · ' + (v.skat === 'logo' ? 'arbejdstøj med logo' : 'arbejdsrelateret') + '</span></div><button type="button" role="switch" class="vippe" aria-checked="' + v.til + '" aria-label="' + esc(v.navn + ' ' + v.farve + ' ' + v.model) + '" data-vare="' + esc(v.id) + '"></button></div>').join('') + '</div></details></div>';
  });
  a.laaste.forEach((g) => { h += '<div class="tt-tr"><div class="tt-mid"><b>' + esc(g.navn) + '</b><span>' + esc(g.grund) + '</span></div><span class="tt-st n">Låst</span><button type="button" role="switch" class="vippe laast" aria-checked="false" disabled aria-label="' + esc(g.navn) + ' er låst"></button></div>'; });
  h += '<p class="hint">Badminton og pickleball er ikke med på listen. Nye varer lægges ind af Claude.</p>';
  h += '<div id="varMsg" class="msg" aria-live="polite"></div>';
  h += bund(tilAntal + ' varer kan vælges', 'Ændringer gælder fra nu, også i kurve, der ikke er sendt', 'Færdig', 'data-gaa="#konto"');
  vis(h);
}

// ------------------------------------------------------------ ruter og hændelser
async function rute() {
  const h = location.hash.replace(/^#/, '');
  const [navn, a, b] = h.split('/');
  window.RTK_TRAVL = false;
  if (S.flashH !== location.hash) S.flash = '';
  const admin = ['konto', 'godkend', 'personer', 'giv', 'varer'].indexOf(navn) >= 0;
  if (S.som && ['t', 'kurv', 'side'].indexOf(navn) < 0) { somLuk(false); }
  if (admin && !S.start.admin) { location.replace('#'); return; }
  if (admin && !S.adm) { vis('<p class="hint">Henter …</p>'); try { await hentAdm(); } catch (err) { vis('<p class="msg err">' + esc(err.message) + '</p>'); return; } }
  else if (admin || !navn) friskOp(h, admin);
  if (navn !== 't' && navn !== 'kurv') S.fejl = '';
  if (navn === 't') vVaelg(a);
  else if (navn === 'kurv') vKurv(a);
  else if (navn === 'side') vSide(a, b);
  else if (navn === 'konto') vKonto();
  else if (navn === 'godkend') vGodkend();
  else if (navn === 'personer') vPersoner();
  else if (navn === 'giv') vGiv(a);
  else if (navn === 'varer') vVarer();
  else vStart();
  if (navn !== 'side') window.scrollTo(0, 0);
}
/** Vis det, vi har, med det samme, og hent det nye bagefter. Tegner kun igen, hvis man stadig er på samme skærm. */
let friskNr = 0;
function friskOp(h, admin) {
  const nr = ++friskNr;
  (admin ? hentAdm() : hentStart()).then(() => {
    if (nr !== friskNr || location.hash.replace(/^#/, '') !== h) return;
    if (document.activeElement && document.activeElement.closest && document.activeElement.closest('#vis') && document.activeElement.tagName === 'INPUT') return;
    tegn();
  }).catch(() => {});
}
function tegn() {
  const y = window.scrollY;
  const aabne = [...document.querySelectorAll('#vis details')].map((d) => d.open);
  const navn = location.hash.replace(/^#/, '').split('/')[0];
  const fokus = document.activeElement && document.activeElement.id;
  if (navn === 't') vVaelg(location.hash.split('/')[1]);
  else if (navn === 'kurv') vKurv(location.hash.split('/')[1]);
  else if (navn === 'side') { const p = location.hash.split('/'); vSide(p[1], p[2]); }
  else if (navn === 'giv') vGiv();
  else if (navn === 'konto') vKonto();
  else if (navn === 'godkend') vGodkend();
  else if (navn === 'personer') vPersoner();
  else if (navn === 'varer') vVarer();
  else vStart();
  const ds = document.querySelectorAll('#vis details');
  if (ds.length === aabne.length) ds.forEach((d, i) => { if (aabne[i]) d.open = true; });
  window.scrollTo(0, y);
  if (fokus && $(fokus)) { const el = $(fokus); el.focus(); if (el.setSelectionRange && el.type !== 'date' && el.type !== 'number') { try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) {} } }
}
window.addEventListener('hashchange', rute);

const toBekraeft = {};
function toTryk(knap, noegle, tekst) {
  if (toBekraeft[noegle] && Date.now() - toBekraeft[noegle] < 6000) { delete toBekraeft[noegle]; return true; }
  toBekraeft[noegle] = Date.now(); knap.classList.add('fyldt'); knap.dataset.foer = knap.textContent; knap.textContent = tekst;
  setTimeout(() => { if (toBekraeft[noegle]) { delete toBekraeft[noegle]; knap.classList.remove('fyldt'); knap.textContent = knap.dataset.foer; } }, 6000);
  return false;
}

$('vis').addEventListener('input', (e) => {
  if (e.target.id === 'cm') { S.cm = e.target.value; tegnGuide(); }
  if (e.target.id === 'beloeb') { giv.beloeb = e.target.value; tegn(); }
  if (e.target.id === 'grund') giv.grund = e.target.value;
});
$('vis').addEventListener('change', (e) => { if (e.target.id === 'frist') { giv.frist = e.target.value; tegn(); } });
function tegnGuide() {
  const g = document.querySelector('.tt-guide');
  if (!g) return;
  const tmp = document.createElement('div'); tmp.innerHTML = skoGuide();
  const ny = tmp.querySelector('.af-preview');
  const gl = g.querySelector('.af-preview');
  if (gl) gl.remove();
  if (ny) g.querySelector('#cm').after(ny);
}

$('vis').addEventListener('click', async (e) => {
  const el = e.target.closest('button, a[data-gaa]');
  if (!el) return;
  const d = el.dataset;
  if (d.gaa) { e.preventDefault(); location.hash = d.gaa; return; }
  const tid = location.hash.split('/')[1];
  const t = tildeling(tid);
  if (d.kat) { S.kat = d.kat; return tegn(); }
  if (d.model) { S.model = d.model; gem('rtk.toej.model', d.model); return tegn(); }
  if (d.str) { S.str[d.v] = d.str; return tegn(); }
  if (d.plus && t) {
    const v = vareMap()[d.plus];
    const s = strFor(t, v);
    if (!s) { S.fejl = 'Vælg en størrelse til ' + v.navn + ' først.'; return tegn(); }
    S.fejl = '';
    if (!kanTilfoeje(t, v)) { S.fejl = t.type === 'pakke' ? 'Pakken er fyldt. Fjern noget først.' : 'Der er ikke penge nok tilbage til ' + v.navn + '.'; return tegn(); }
    return aendr(t, v.id, s, 1);
  }
  if (d.minus && t) { const v = vareMap()[d.minus]; const s = strFor(t, v); if (!s) return; return aendr(t, v.id, s, -1); }
  if (d.fjern && t) { const [v, s] = d.fjern.split('|'); return aendr(t, v, s, -antalI(t, v, s)); }
  if (el.id === 'somLuk') { somLuk(true); return; }
  if (S.som && (el.id === 'send' || el.id === 'fortryd' || el.id === 'modtaget')) return;
  if (el.id === 'send' && t) {
    if (S.gemmer[t.id] || S.venter[t.id]) { besked($('kurvMsg'), 'Gemmer stadig …'); return; }
    el.disabled = true; besked($('kurvMsg'), 'Sender …');
    try { opdaterT(await motor('toej', 'send', { tid: t.id }, nyId())); S.kladde[t.id] = null; window.RTK_TRAVL = false; tegn(); }
    catch (err) { besked($('kurvMsg'), err.message, 'err'); el.disabled = false; }
    return;
  }
  if (el.id === 'fortryd' && t) {
    el.disabled = true;
    try { opdaterT(await motor('toej', 'fortryd', { tid: t.id }, nyId())); location.hash = '#t/' + t.id; }
    catch (err) { besked($('kurvMsg'), err.message, 'err'); el.disabled = false; }
    return;
  }
  if (el.id === 'modtaget' && t) {
    el.disabled = true;
    try { opdaterT(await motor('toej', 'modtaget', { tid: t.id }, nyId())); tegn(); }
    catch (err) { besked($('kurvMsg'), err.message, 'err'); el.disabled = false; }
    return;
  }
  // Administratorerne
  if (d.som) {
    el.disabled = true;
    try { const s = await motor('toej', 'som', { tid: d.som }); somStart(s, true, location.hash || '#'); location.hash = '#kurv/' + d.som; }
    catch (err) { besked($('admMsg'), err.message, 'err'); el.disabled = false; }
    return;
  }
  if (d.somgiv || d.somvis) {
    const o = S.adm;
    const pakke = d.somvis ? d.somvis === 'pakke' : giv.type === 'pakke';
    const pk = o.pakker.find((p) => p.id === (d.somvis ? 'time' : giv.pakke)) || o.pakker[0];
    const forste = d.somgiv ? o.personer.find((p) => p.pid === giv.pids[0]) : null;
    const beloeb = pakke ? pk.beloeb : d.somvis ? 8500 : (Number(String(giv.beloeb).replace(/\./g, '')) || 0);
    const t = { id: 'VIS', type: pakke ? 'pakke' : 'frit', pakke: pakke ? { id: pk.id, navn: pk.navn, pladser: pk.pladser } : null, beloeb, status: 'aaben', frist: d.somgiv ? giv.frist : '', forlaenget: '', linjer: [], valgt: 0, besked: '' };
    somStart({ mig: forste ? { navn: forste.navn } : { navn: 'En træner', fornavn: 'en træner' }, admin: false, tildelinger: [t], varer: S.start.varer.filter((v) => v.til !== false), sko: S.start.sko, katalog: S.start.katalog }, false, location.hash || '#');
    location.hash = '#t/VIS';
    return;
  }
  if (d.godkend) {
    el.disabled = true;
    try { const r = await motor('toej', 'godkend', { tid: d.godkend }, nyId()); await hentAdm(); tegn(); if (r.advarsel) besked($('admMsg'), r.advarsel, 'err'); else besked($('admMsg'), 'Godkendt.', 'okm'); }
    catch (err) { besked($('admMsg'), err.message, 'err'); el.disabled = false; }
    return;
  }
  if (d.afvis) { $('afv' + d.afvis).classList.remove('hidden'); $('afvt' + d.afvis).focus(); return; }
  if (d.afvissend) {
    el.disabled = true;
    try { await motor('toej', 'afvis', { tid: d.afvissend, tekst: $('afvt' + d.afvissend).value }, nyId()); await hentAdm(); tegn(); besked($('admMsg'), 'Sendt tilbage med en sms.', 'okm'); }
    catch (err) { besked($('admMsg'), err.message, 'err'); el.disabled = false; }
    return;
  }
  if (d.mangler) {
    if (!toTryk(el, 'm' + d.mangler, 'Tryk igen: ikke på lager')) return;
    const [tt, r] = d.mangler.split(':');
    try { await motor('toej', 'mangler', { tid: tt, raekke: Number(r) }, nyId()); await hentAdm(); tegn(); besked($('admMsg'), 'Træneren har fået en sms og kan vælge noget andet.', 'okm'); }
    catch (err) { besked($('admMsg'), err.message, 'err'); }
    return;
  }
  if (el.id === 'ordre') {
    el.disabled = true;
    try {
      const r = await motor('toej', 'ordre', {}, nyId()); await hentAdm(); tegn();
      $('ordreUd').innerHTML = '<div class="af-preview"><span class="k">Mailen til Carsten</span><b>Ordre ' + esc(r.id) + ' · kontoen ' + kr(r.konto) + (r.sg ? ' · Sports Group ' + kr(r.sg) : '') + '</b><pre class="tt-mail">' + esc(r.tekst) + '</pre>' +
        '<div class="af-chips">' + chip('Kopiér mailen', null, 'data-kopi="' + r.id + '"') + (r.til ? '<a class="af-chip" href="mailto:' + encodeURIComponent(r.til) + '?subject=' + encodeURIComponent('RTK trænertøj, ordre ' + r.id) + (r.kopi ? '&cc=' + encodeURIComponent(r.kopi) : '') + '&body=' + encodeURIComponent(r.tekst) + '">Åbn i mail</a>' : '') + '</div>' +
        (r.fragtfri ? '' : '<span class="hint">Ordren er under 2.500 kr. ekskl. moms, så der kommer fragt. Fragt trækkes ikke på kontoen.</span>') + '</div>';
    } catch (err) { besked($('admMsg'), err.message, 'err'); el.disabled = false; }
    return;
  }
  if (d.kopi) {
    const r = S.adm.ordrer.find((x) => x.id === d.kopi);
    try { await navigator.clipboard.writeText(r.tekst); el.textContent = 'Kopieret'; } catch (err) { el.textContent = 'Markér teksten og kopiér'; }
    return;
  }
  if (d.lever) {
    if (!toTryk(el, 'l' + d.lever, 'Tryk igen: leveret')) return;
    try { const r = await motor('toej', 'lever', { ordre: d.lever }, nyId()); await hentAdm(); tegn(); besked($('admMsg'), 'Leveret. ' + kr(r.konto) + ' er trukket på kontoen, og ' + r.personer.length + ' har fået sms om afhentning.', 'okm'); }
    catch (err) { besked($('admMsg'), err.message, 'err'); }
    return;
  }
  if (el.id === 'csv') { hentCsv(); return; }
  if (d.pid) { const i = giv.pids.indexOf(d.pid); if (i >= 0) giv.pids.splice(i, 1); else giv.pids.push(d.pid); if (giv.pids.length === 1) { giv.beloeb = ''; giv.betaler = ''; giv.forslagFor = ''; } return tegn(); }
  if (d.alle) { giv.pids = S.adm.personer.filter((p) => p.kategori === d.alle).map((p) => p.pid); giv.beloeb = ''; giv.betaler = ''; giv.forslagFor = ''; return tegn(); }
  if (d.type) { giv.type = d.type; return tegn(); }
  if (d.betaler) { giv.betaler = d.betaler; return tegn(); }
  if (el.id === 'givKnap') {
    el.disabled = true; besked($('givMsg'), 'Giver …');
    try {
      const r = await motor('toej', 'giv', { pids: giv.pids, type: giv.type, pakke: giv.pakke, betaler: giv.betaler, beloeb: giv.beloeb, frist: giv.frist, grund: giv.grund }, nyId());
      Object.assign(giv, { pids: [], beloeb: '', betaler: '', grund: '', forslagFor: '' });
      await hentAdm(); await hentStart();
      S.flash = r.tildelinger.length + ' tildeling' + (r.tildelinger.length > 1 ? 'er' : '') + ' givet. Sms og notifikation er sendt.';
      S.flashH = '#konto'; location.hash = '#konto';
    } catch (err) { besked($('givMsg'), err.message, 'err'); el.disabled = false; }
    return;
  }
  if (d.vare || d.gruppe) {
    // Kontakten skifter med det samme og gemmer bagefter
    const til = d.vare ? el.getAttribute('aria-checked') !== 'true' : d.til === 'ja';
    el.setAttribute('aria-checked', String(til));
    e.preventDefault();
    try {
      const r = await motor('toej', 'vareTil', d.vare ? { id: d.vare, til } : { gruppe: d.gruppe, til }, nyId());
      S.varerAdm = await motor('toej', 'varer'); await hentStart(); tegn(); besked($('varMsg'), r.slaaetTil + ' varer kan vælges nu.', 'okm');
    } catch (err) { el.setAttribute('aria-checked', String(!til)); besked($('varMsg'), err.message, 'err'); }
  }
});

function hentCsv() {
  const o = S.adm;
  const r = [['Tildeling', 'Navn', 'Type', 'Beløb', 'Betaler', 'Status', 'Valgt', 'Frist', 'Godkendt']].concat(o.tildelinger.map((t) => [t.id, t.navn, t.type, t.beloeb, t.betaler, t.status, t.valgt, t.frist, t.godkendt]))
    .concat([[], ['Træk', 'Bilag', 'Beskrivelse', 'Beløb', 'Ordre']]).concat(o.traek.map((x) => [x.tid, x.bilag, x.beskrivelse, x.beloeb, x.ordre]));
  const csv = '﻿' + r.map((l) => l.map((c) => '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"').join(';')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'RTK_konto_' + new Date().toISOString().slice(0, 10) + '.csv'; a.click();
}

async function start() {
  $('omraade').classList.remove('hidden');
  $('hvem').textContent = 'Logget ind som ' + person.navn;
  try { await hentStart(); if (S.start.admin) hentAdm().then(() => { if (!location.hash) tegn(); }).catch(() => {}); }
  catch (err) { vis('<p class="msg err">' + esc(err.message) + '</p>'); return; }
  rute();
}
if (!token) location.replace('./?til=arbejdstoej.html');
else motor('kerne', 'mig').then((p) => { person = p; start(); }).catch(() => {});
