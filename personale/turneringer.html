.tu-adv{border-left:4px solid #C98A00}.tu-adv ul{margin:6px 0 0;padding-left:18px}.tu-adv li{margin:2px 0}.tu-adv .tu-p{margin:0}

<script>
// Turneringer for personale og frivillige (Lars 14. november 2026). Motoren henter turneringerne hver torsdag fra
// Tournament Software og DGI (moduler/turneringer.gs). Status og orientering regner motoren ud, når listen hentes.
// Planlagte turneringer fra DTF's terminsliste og advarsler til administratorerne kommer også fra motoren (18. november 2026).
// Alt på siden kommer fra kilderne eller fra regellaget (Turneringer/generators/sources/regler_og_begreber.txt). Intet er opfundet.
const MILJOE = window.RTK_KONFIG.miljoe;
const URL_MOTOR = window.RTK_KONFIG.motor;
const $ = (id) => document.getElementById(id);
const gem = (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
const hent = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let token = hent('rtk.token') || '';
let person = null;
if (MILJOE === 'test') $('testBanner').classList.remove('hidden');
function besked(el, t, s) { el.textContent = t || ''; el.className = 'msg' + (s ? ' ' + s : ''); }

async function motor(modul, handling, data) {
  let res;
  try { res = await fetch(URL_MOTOR, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ modul, handling, data: data || {}, token, id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()) }) }); }
  catch (e) { throw new Error('Ingen forbindelse. Tjek net og prøv igen.'); }
  let svar;
  try { svar = await res.json(); } catch (e) { throw new Error('Ingen forbindelse. Tjek net og prøv igen.'); }
  if (!svar.ok) { if (svar.login) logUd(true); throw new Error(svar.fejl || 'Noget gik galt'); }
  return svar.data;
}
function logUd(udloebet) {
  if (window.RTK_UD) return; window.RTK_UD = true;
  if (!udloebet && token) motor('kerne', 'logud').catch(() => {});
  token = ''; person = null; gem('rtk.token', null); gem('rtk.mig', null);
  location.replace(udloebet ? './?til=turneringer.html&igen=1' : './');
}
$('logud').addEventListener('click', () => logUd(false));

// ---------------------------------------------------------------- Tekster fra regellaget (kort omskrevet, kilderne står i regler_og_begreber.txt)
// Trappen (Lars 14. november kl. 22.56): boldene, man bevæger sig igennem, og så kategorierne. Kilder: DTF's Tennis10-side og
// rækkeoversigten for Vinter Tour (bolde og baner), Tennis Øst afsnit 1.2 og 1.7 (skum for børn og voksne), DTF-reglementet sektion 27.
const BOLDE = [
  ['Skum', 'Skumbold på badmintonbane. Primært for juniorer fra U8, men skum er for alle aldre: Tennis Øst holder åbent SM i skumtennis for både juniorer og voksne, og der er skumhold helt op til senior.'],
  ['Rød', 'Rød bold eller skumbold på rød bane. Tennis10, puljer på tid.'],
  ['Orange', 'Orange bold på orange bane. Tennis10.'],
  ['Grøn', 'Grøn bold på almindelig bane. Tennis10 og de første kategorier på stor bane: U12 i Kat. 4 og 3 og U14 i Kat. 4.'],
  ['Gul', 'Almindelig bold. U12 fra Kat. 2, U14 fra Kat. 3, og U16, U18, senior og veteran altid.']];
const TRAPPE = [
  ['Kat. 4', 'For nye turneringsspillere fra U12. Altid puljer med 8 spillere.'],
  ['Kat. 3', 'For spillere i den nederste del af ranglisten.'],
  ['Kat. 2', 'For de næstbedste.'], ['Kat. 1', 'For de bedste.'],
  ['Kat. G', 'Grand Prix for de bedste.'], ['Kat. A', 'DM for seniorer og UM for juniorer.']];
// Hvor melder man sig til (Lars 14. november kl. 22.56). Kilder: Tennis Øst afsnit 1.6 og 8, DTF's Vinter Tour og Tennis10-side, DGI.
// Terminslisten tilføjet 18. november 2026 (Lars kl. 07.42), regellaget B23.
const STEDER = [
  ['Tennis Øst og DTF i Tournament Software', 'Næsten alle tennisturneringer: ranglisteturneringer, Tennis10, veteraner, GameOn og Sjællandsmesterskaberne. Man tilmelder sig med en gratis profil i Tournament Software. Søg på turneringens kode.', 'https://dtf.tournamentsoftware.com'],
  ['DGI', 'De fleste skumstævner, som Tennis Øst holder sammen med DGI. Man tilmelder sig hos DGI og kan deltage uden at være medlem af en klub. Søg på arrangementets nummer.', 'https://www.dgi.dk/idraet/idraetter-i-dgi/tennis/skumtennis'],
  ['DTF\'s terminsliste', 'DTF\'s plan for hele sæsonen: alle turneringer med kategori på Vinter og Sommer Tour med dato, arrangør, rækker og gebyr. Man tilmelder sig ikke her. Klubberne opretter selv turneringerne i Tournament Software, nogle først tæt på datoen, så en turnering kan stå i planen, før man kan melde sig til. Skumstævner hos DGI, GameOn og TiD Tour står ikke i planen.', 'https://tennis.dk/spiller/turneringer-2/individuelle-turneringer/vinter-tour/']];
const FORKLAR = {
  'Skum': 'Det blødeste sted at starte. Badmintonbane og skumbold, puljer på tid, så alle får mange kampe. Primært for juniorer, men også for voksne, fx Tennis Østs åbne SM i skumtennis. Man kan deltage uden at være medlem af en klub.',
  'Rød': 'Tennis10 for U10: rød bold på rød bane, så orange bold på orange bane og grøn bold på almindelig bane. Rækkerne er kønsneutrale, og der er ingen rangliste i U10.',
  'Kat. 4': 'Primært for nye turneringsspillere. Det er stedet at starte på stor bane, og mange rækker spilles i puljer.',
  'Kat. 3': 'For spillere i den nederste del af ranglisten. Første turnering på stor bane? Så er Kat. 4 stedet at starte.',
  'Kat. 2': 'For de næstbedste på ranglisten.', 'Kat. 1': 'For de bedste på ranglisten.', 'Kat. G': 'Grand Prix-turneringer for de bedste.'
};
FORKLAR['Orange'] = FORKLAR['Grøn'] = FORKLAR['Rød'];
const ORD = [['Pulje', '3 til 8 spillere, hvor alle møder alle.'], ['Bonusrunde', 'En ekstra kamp til dem, der taber i første runde.'],
  ['Next Gen', 'Korte sæt til 4.'], ['Termin', 'Normalt en uge. På Vinter Tour må man kun spille én række i én turnering pr. termin.'],
  ['Licens', 'Giver point på ranglisten. Se Licens ovenfor.']];
// Turneringstyper, veteraner og licens (Lars 14. november kl. 22.27). Kilder: DTF's reglementer for individuelle turneringer og for
// veteranturneringer (november 2025, sektion 16, 25, 27, 30 og 39), tennis.dk "Licens og klubskifte", tennis.dk om UM ude og Tennis Øst. Læst 14. november 2026.
const TYPER = {
  'Ranglisteturnering': ['Ranglisteturnering', 'En turnering, som DTF har givet en kategori (Kat. 4, 3, 2, 1, G eller A). Den giver point til DTF\'s rangliste til spillere med licens.'],
  'Veteranturnering': ['Veteranturnering', 'For voksne i aldersgrupper med 5 års spring. Vinter Tour 2026/27 har rækker fra 35+ til 75+, og reglementet går fra 30+ til 90+. Man hører til en gruppe fra det år, man fylder alderen. Veteranerne har deres eget reglement med Kat. 3, 2 og 1 og DM.'],
  'Skumtennis': ['Skumtennis', 'Skumbold på badmintonbane, puljer på tid, så alle får mange kampe. Primært for juniorer, men skum er for alle aldre, og Tennis Øst holder åbent SM i skumtennis for både juniorer og voksne. Ingen licens, og man kan deltage uden klub.'],
  'GameOn double': ['GameOn double', 'DTF\'s doublestævner for motionister. Man vælger selv niveau fra A (meget øvet) til D (nybegynder) og er sikret mindst 3 kampe. Ingen ranglistepoint, men kampene tæller i WTN. Man kan melde sig alene og finde en makker.']
};
// Ranglisten (Lars 14. november kl. 23.00). Kilder: DTF's regler for pointtildeling (oktober 2023, punkt 1, 2 og 4), DTF's side
// Ranglister (læst 14. november 2026), reglementet sektion 16 og 18, Vinter Tour 2026/27 (kategorier og doubler til WTN).
const RANGLISTE = [
  ['Hvad er den?', 'DTF\'s nationale ranglister for U12, U14, U16, U18, senior og veteran. Spillere i U14, U16 og U18 står også på seniorranglisten. U10 og Tennis10 har ingen rangliste.'],
  ['Hvem kommer på?', 'Kun spillere med aktiv licens får point.'],
  ['Hvordan får man point?', 'Kun singlekampe tæller. Ranglisten lægger de 10 bedste individuelle turneringer fra de sidste 52 uger sammen med point fra holdkampe og internationale turneringer. I en cupturnering får man point for den runde, man taber i, og intet for at tabe første runde (undtagen U12 i Kat. 3). I en pulje får man point for hver vundet kamp. Jo højere kategori, jo flere point.'],
  ['Hvornår opdateres den?', 'Hver uge med resultaterne fra ugen før. Internationale point cirka hver anden uge. Point forsvinder igen efter 52 uger.'],
  ['Hvad bruges den til?', 'Til at fordele spillerne: hvem kommer med, når der er flere tilmeldte end pladser, og hvem må spille Kat. 2 og 3. Den bruges også til seedning.'],
  ['Og WTN?', 'World Tennis Number er noget andet: ITF\'s niveaumål for alle spillere, også uden licens, hvor doubler også tæller. GameOn-kampe og doubler tæller i WTN, og DM for veteraner bruger det.']
];
const RANGLISTE_LINK = [['DTF\'s side om ranglisterne (med link til listerne)', 'https://tennis.dk/spiller/ranglister-2/'], ['DTF\'s regler for point', 'https://tennis.dk/wp-content/uploads/2023/10/Regler-pointtildeling_oktober2023.pdf']];
const LICENS = [

const dt = (iso) => { const [a, m, d] = String(iso).slice(0, 10).split('-').map(Number); return new Date(Date.UTC(a, m - 1, d)); };
const kortDag = (iso) => { const d = dt(iso); return UGEDAG[d.getUTCDay()].slice(0, 3) + ' ' + d.getUTCDate() + '. ' + MDR[d.getUTCMonth()].slice(0, 3); };

const uge = (iso) => { const d = dt(iso); const t = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() + 4 - (d.getUTCDay() || 7))); return Math.ceil(((t - Date.UTC(t.getUTCFullYear(), 0, 1)) / 86400000 + 1) / 7); };

// Rækkerne: en turnering passer, når mindst én række, der ikke er aflyst, passer på alder, niveau og køn
function raekkePasser(r) {
  if (r.af) return false;
  if (V.alder && !(V.alder === 'Veteran' ? /^\d{2}\+/.test(r.a) : r.a === V.alder)) return false;
  if (V.niveau !== 'Alle') {
    if (V.niveau === 'Uden kategori') { if (r.kat || ['Skum', 'Rød', 'Orange', 'Grøn'].indexOf(r.b) >= 0) return false; }
    else if (/^Kat\./.test(V.niveau)) { if (r.kat !== V.niveau) return false; }
    else if (r.b !== V.niveau) return false;
  }
  if (V.koen !== 'Alle') {
    const ok = V.koen === 'Drenge og herrer' ? ['Herre/drenge', 'Kønsneutral', 'Mix', ''] : ['Dame/pige', 'Kønsneutral', 'Mix', ''];
    if (ok.indexOf(r.k) < 0) return false;
  }
  return true;
}
const raekkeFilter = () => !!V.alder || V.niveau !== 'Alle' || V.koen !== 'Alle';
// Kender kilden ikke stedet, vises turneringen både under Sjælland og Resten af landet (E2E-test 14. november)

}
function soeg(q) {

  return D.turneringer.filter((t) => { const s = [t.navn, t.by, t.kode, t.arrangoer, t.spillested, t.spillesteder, t.postnr].join(' ').toLowerCase(); return ord.every((o) => s.indexOf(o) >= 0); });
}

// Et menneskeligt navn på en række: "U14 drenge single Kat. 3"
function raekkeNavn(r) {
  if (!r.a) return r.r;
  const sen = r.a === 'Senior' || /^\d{2}\+/.test(r.a);
  const k = { 'Herre/drenge': sen ? 'herrer' : 'drenge', 'Dame/pige': sen ? 'damer' : 'piger', 'Mix': 'mix' }[r.k] || '';
  const niv = r.kat || (r.b && r.b !== 'Gul' ? r.b.toLowerCase() + ' bold' : '') || r.n || (r.w ? 'WTN ' + r.w.replace('-', ' til ') : '');
  return [r.a === 'Senior' ? 'Senior' : r.a, k, r.d ? r.d.toLowerCase() : '', niv].filter(Boolean).join(' ').replace('Skum bold', 'skum').replace('skum bold', 'skum');
}
function linjeOm(t) {
  const m = raekkeFilter() ? t.raekker.filter(raekkePasser) : [];
  if (m.length === 1) return raekkeNavn(m[0]) + (+m[0].ti > 0 ? ' · ' + m[0].ti + ' tilmeldt' : '');
  if (m.length > 1) { const n = m.reduce((s, r) => s + (+r.ti || 0), 0); return m.length + ' rækker passer' + (n ? ' · ' + n + ' tilmeldt' : ''); }
  return [t.aldre, katKort(t.kategorier), +t.tilmeldte > 0 ? t.tilmeldte + ' tilmeldt' : t.pris].filter(Boolean).join(' · ');
}
function statusChip(t) {
  const k = { 'Lukker snart': 'snart', 'Aflyst': 'snart', 'Åben': 'aaben', 'Planlagt': 'plan' }[t.status] || 'ikke';
  // Planlagt: står i DTF's terminsliste, men ikke i Tournament Software endnu (Lars 18. november kl. 08.13)
  return '<span class="tu-st ' + k + '">' + esc(t.status === 'Ikke åbnet' && t.aabner ? 'Åbner ' + dagMd(t.aabner) : t.status === 'Planlagt' ? 'Ej i Tournament Software endnu' : t.status) + '</span>';
}
// "Kat. 2, Kat. 3, Kat. 4" bliver til "Kat. 2, 3 og 4"
function katKort(s) {
  const l = String(s || '').split(', ').filter(Boolean);
  if (!l.length) return '';
  const og = (x) => x.length === 1 ? x[0] : x.slice(0, -1).join(', ') + ' og ' + x[x.length - 1];
  return l.every((x) => /^Kat\. /.test(x)) ? 'Kat. ' + og(l.map((x) => x.slice(5))) : og(l);
}
// RTK-spillere og deres kampe fra i dag og 7 dage frem (Lars 21. november 2026 kl. 22.13). Motoren henter dem hver morgen kl. 6.

const rtkAntal = (id) => +rtkD().antal[id] || new Set(rtkKampe(id).flatMap((k) => k.sp.split(' og '))).size;

// Dagene med kampe i Roskilde (Darup) i turneringer, der spilles mange steder, fx SM (Lars 21. november kl. 21.25). Kun dage fra i dag
const dageRtk = (t) => String(t.dageRtk || '').split('; ').filter(Boolean).map((x) => { const [d, n] = x.split(':'); return { d, n: +n || 0 }; }).filter((o) => o.d >= D.idag);

function kort(t, linje) {

    '<span class="tu-r">' + esc([linje === undefined ? linjeOm(t) : linje, rtkAntal(t.id) ? rtkAntal(t.id) + ' RTK-spillere' : ''].filter(Boolean).join(' · ')) + '</span><span class="tu-f">' + statusChip(t) + (t.lukker && t.status !== 'Aflyst' ? ' Frist ' + esc(kortDag(t.lukker)) : '') + '</span>' +

// Push som tilvalg: "Ny terminsliste fra DTF". Valget gemmes i motoren (push.gemValg) og gælder alle ens telefoner
let PUSH = null;
function pushKontakt() {
  if (!erAdmin()) return '';
  if (!PUSH) { pushHent(); return '<p class="hint" style="margin:10px 0 0">Henter dine notifikationer …</p>'; }
  if (PUSH.fejl) return '<p class="hint" style="margin:10px 0 0">' + esc(PUSH.fejl) + '</p>';
  let h = '<button type="button" class="tu-sw" id="tlPush" role="switch" aria-checked="' + !!PUSH.valg.terminsliste + '" style="margin-top:10px"><span class="tu-tog" aria-hidden="true"></span> Giv mig besked på telefonen, når DTF lægger en ny terminsliste op</button>';
  if (!PUSH.enheder) h += '<p class="hint" style="margin:4px 0 0">Notifikationer er ikke slået til på nogen af dine enheder. Slå dem til under <a href="../beskeder.html">Beskeder</a>.</p>';
  return h;
}
async function pushHent() {
  if (window.TU_PUSH_HENTER) return; window.TU_PUSH_HENTER = true;
  try { const r = await motor('push', 'status'); PUSH = { valg: r.valg || {}, enheder: (r.enheder || []).length }; }
  catch (e) { PUSH = { fejl: 'Kunne ikke hente dine notifikationer: ' + e.message }; }
  window.TU_PUSH_HENTER = false; tegn();
}
async function pushSkift() {
  const ny = !PUSH.valg.terminsliste;
  PUSH.valg.terminsliste = ny; tegn();
  try { const r = await motor('push', 'gemValg', { valg: { terminsliste: ny } }); PUSH.valg = r.valg; }
  catch (e) { PUSH.valg.terminsliste = !ny; besked($('hentMsg'), 'Kunne ikke gemme valget: ' + e.message, 'err'); }
  tegn();
}

  const l = filtrer();
  const hvorT = { naer: 'nær Roskilde', sj: 'på Sjælland', rest: 'i resten af landet' }[V.hvor] || '';

  else h += '<div><i></i>Se fristen hos arrangøren</div>';
  if (t.type === 'Ranglisteturnering' || t.type === 'Mesterskab') h += '<div><i></i>Afbud senest 48 timer før første kamp</div>';
  h += '</div>';
  if (t.kode) h += '<div class="tu-kode"><span>Søg på <b>' + esc(t.kode) + '</b> ' + (t.kilde === 'DGI' ? 'hos DGI' : 'i Tournament Software') + '</span><button type="button" class="ghost" data-kopier="' + esc(t.kode) + '">Kopiér koden</button></div>';

// En turnering, der står i DTF's terminsliste, men ikke er oprettet i Tournament Software endnu (Lars 18. november 2026 kl. 07.42)
function visPlanlagt(t) {

    h += '<p class="tu-ant" style="margin:14px 0 6px"><b>Rækkerne i terminslisten</b> · ' + rr.length + (rr.length === 1 ? ' række' : ' rækker') + '</p><table class="tu-tab">';
    rr.slice(0, 12).forEach((r) => { h += '<tr class="' + (m && raekkePasser(r) ? 'match' : '') + '"><td>' + esc(raekkeNavn(r)) + '<br><span class="hint" style="font-size:12px">' + esc([stor(kortDag(r.dag)), r.fo, r.pl ? r.pl + ' pladser' : '', r.bo === 'Ja' ? 'bonusrunde' : ''].filter(Boolean).join(' · ')) + '</span></td><td class="n">' + esc(r.ge ? r.ge + ' kr.' : '') + '</td></tr>'; });

  h += '<p class="tu-p" style="margin-top:10px">Arrangør: ' + esc(t.arrangoer) + '. Når turneringen er oprettet, står den her med frist og tilmeldte efter næste hentning (torsdag).</p>';

function tekstTil(t) {
  let s = t.navn + ', ' + datoer(t).replace(/^./, (c) => c.toLowerCase()) + (t.spillested ? ' i ' + t.spillested : t.irtk && t.spillesteder ? (dageRtk(t).length ? ', i Roskilde (Darup) ' + dageRtk(t).map((o) => langDag(o.d)).join(', ') : ', bl.a. i Roskilde (Darup)') : t.by ? ' i ' + t.by : '') + '.\n';
  if (t.orientering) s += t.orientering + '\n';
  const m = raekkeFilter() ? t.raekker.filter(raekkePasser).filter((r) => +r.ti > 0) : [];
  if (m.length === 1) s += stor(raekkeNavn(m[0])) + ' har ' + m[0].ti + ' tilmeldt indtil nu.\n';
  s += '\n' + (t.kode ? 'Søg på ' + t.kode + (t.kilde === 'DGI' ? ' hos DGI.' : ' i Tournament Software.') : 'Søg på ' + t.navn + ' i Tournament Software.');
  return s;
}

  ['Én plads kan være et wildcard', 'I en række med plads til 8 kan turneringsledelsen give 1 wildcard. I Roskilde går det som regel til en spiller fra RTK.', 'DTF\'s reglement, sektion 31 og 70. Roskildes praksis efter stævneleder Mads Christensen'],
  ['Ikke med? Så er man reserve', 'Reservelisten hedder "Alternates" i Tournament Software. Arrangøren kontakter reserverne, hvis der bliver plads, men man skal selv holde øje. Vil man ikke være reserve, melder man afbud til arrangøren.', 'DTF, Comwell Vinter Tour (Reserver)'],
  ['Med? Så kommer betalingen fra klubben', 'Når lodtrækningen er lavet, sender arrangøren besked med gebyret. Gebyret er forskelligt fra turnering til turnering. Eksempel: Ved RTK Cup 50 er det 275 kr. for U12 Kat. 4. Står man på deltagerlisten, er tilmeldingen bindende, også ved afbud.', 'DTF, Comwell Vinter Tour (Betaling), reglementet sektion 63. Roskildes praksis efter Mads Christensen'],
  ['Lodtrækning og kampprogram', 'Kommer på turneringens side i Tournament Software og under turneringen i Mit RTK. Afbud efter fristen går direkte til arrangøren, ikke til Tournament Software. Eksempel: Ved RTK\'s stævner er det stævneleder Mads Christensen på turnering@roskildetennisklub.dk eller 30 65 29 65. Arrangørens kontakt står på turneringens side i Tournament Software. Afbud senere end 48 timer før start giver karantænepoint.', 'Mailen fra Tournament Software, DTF, Comwell Vinter Tour (Afbud til turneringer) og RTK Cup 50 i Tournament Software (Kontakt)']
];
function pladsKort() {
  return '<div class="card" id="plads"><h3 class="tu-h" style="margin-bottom:8px">Fra tilmelding til plads</h3><p class="tu-p" style="margin:0 0 10px">En tilmelding er ikke en plads. Sådan foregår det i DTF\'s turneringer, fx RTK Cup:</p><ol class="tu-trappe">' +
    PLADS.map(([t, b, k, ekstra]) => '<li><b>' + esc(t) + '</b>' + esc(b) + (ekstra || []).map(([o, x]) => '<br><br><b style="display:inline">' + esc(o) + '</b> ' + esc(x)).join('') + '<span class="tu-kilde">Kilde: ' + esc(k) + '</span></li>').join('') +
    '</ol><p class="tu-p" style="margin:10px 0 0">Eksempel: RTK Cup 50 har 26 tilmeldte til 2 rækker med plads til 8 i hver (24. november).</p></div>';
}
function visKort() {
  let h = faner('kort') + '<div class="tu-smal">' + pladsKort();
  h += '<div class="card" id="steder"><h3 class="tu-h" style="margin-bottom:8px">Hvor melder man sig til?</h3><dl class="tu-ord">' + STEDER.map(([o, t, u]) => '<dt>' + esc(o) + '</dt><dd>' + esc(t) + ' <a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(u.replace('https://', '').replace(/\/.*$/, '')) + '</a></dd>').join('') + '</dl></div>';
  if (erAdmin()) h += '<div class="card"><h3 class="tu-h" style="margin-bottom:4px">Besked om nye terminslister</h3><p class="tu-p" style="margin:0">DTF lægger en ny terminsliste op et par gange i hver sæson. Mit RTK læser den om torsdagen og viser, hvad der er ændret, under Find i 14 dage. Kun for administratorer.</p>' + pushKontakt() + '</div>';
  h += '<div class="card"><h3 class="tu-h" style="margin-bottom:8px">Hvor starter man?</h3><p class="tu-p" style="margin:0 0 8px">Boldene, man bevæger sig igennem:</p><ol class="tu-trappe">' + BOLDE.map(([t, b]) => '<li><b>' + esc(t) + '</b>' + esc(b) + '</li>').join('') + '</ol><p class="tu-p" style="margin:12px 0 8px">Kategorierne på stor bane, fra U12:</p><ol class="tu-trappe">' + TRAPPE.map(([t, b]) => '<li><b>' + esc(t) + '</b>' + esc(b) + '</li>').join('') + '</ol></div>';
  // Årgangene skifter selv ved nytår: det år, man fylder 10, 12, 14, 16 eller 18, er sidste år i gruppen
  const y = +D.idag.slice(0, 4);
  const aar = (Y) => [['U10', (Y - 10) + ' og senere'], ['U12', (Y - 12) + ' og ' + (Y - 11)], ['U14', (Y - 14) + ' og ' + (Y - 13)], ['U16', (Y - 16) + ' og ' + (Y - 15)], ['U18', (Y - 18) + ' og ' + (Y - 17)], ['Senior', (Y - 19) + ' og før']];
  const a = aar(y), b = aar(y + 1);
  h += '<div class="card"><h3 class="tu-h" style="margin-bottom:8px">Hvilken aldersgruppe?</h3><table class="tu-tab"><tr><th></th><th>Født, ' + y + '<br>til nytår</th><th>Født, ' + (y + 1) + '<br>fra nytår</th></tr>';
  a.forEach((r, i) => { h += '<tr><td><b>' + r[0] + '</b></td><td>' + r[1] + '</td><td>' + b[i][1] + '</td></tr>'; });
  h += '</table><p class="tu-p" style="margin:10px 0 0">Gruppen skifter ved nytår. Det år, man fylder 10, 12, 14, 16 eller 18, er sidste år i gruppen.</p><p class="tu-p" style="margin:6px 0 0">U12 må også spille U14. U10 spiller kun i egen gruppe.</p></div>';
  h += '<div class="card" id="typer"><h3 class="tu-h" style="margin-bottom:8px">Hvad er hvad?</h3><dl class="tu-ord">' + Object.keys(TYPER).map((k) => '<dt>' + esc(TYPER[k][0]) + '</dt><dd>' + esc(TYPER[k][1]) + '</dd>').join('') + '</dl></div>';
  h += '<div class="card" id="rangliste"><h3 class="tu-h" style="margin-bottom:8px">Ranglisten</h3><dl class="tu-ord">' + RANGLISTE.map(([o, t]) => '<dt>' + esc(o) + '</dt><dd>' + esc(t) + '</dd>').join('') + '</dl>' +
    '<p class="tu-p" style="margin:10px 0 0">' + RANGLISTE_LINK.map(([n, u]) => '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(n) + '</a>').join('<br>') + '</p></div>';
  h += '<div class="card" id="licens"><h3 class="tu-h" style="margin-bottom:8px">Licens</h3><dl class="tu-ord">' + LICENS.map(([o, t]) => '<dt>' + esc(o) + '</dt><dd>' + esc(t) + '</dd>').join('') + '</dl>' +
    '<table class="tu-tab" style="margin-top:12px"><tr><th>Pris</th><th style="text-align:right">Købt før ' + esc(LICENS_PRIS.foer.replace(' 2027', '')) + '</th><th style="text-align:right">Fra ' + esc(LICENS_PRIS.foer) + '</th></tr>' +
    LICENS_PRIS.pris.map(([n, a, b]) => '<tr><td>' + esc(n) + '</td><td class="n">' + a + ' kr.</td><td class="n">' + b + ' kr.</td></tr>').join('') +
    '</table><p class="hint" style="font-size:13px">Priserne er DTF\'s for licens, der gælder til ' + esc(LICENS_PRIS.til) + '.</p></div>';
  h += '<div class="card"><h3 class="tu-h">Ord, man møder</h3><dl class="tu-ord">' + ORD.map(([o, t]) => '<dt>' + esc(o) + '</dt><dd>' + esc(t) + '</dd>').join('') + '</dl></div>';
  return h + '</div>';
}

// ---------------------------------------------------------------- Navigation med #, så telefonens tilbage virker
function rute() { return (decodeURIComponent(location.hash.slice(1)) || 'find').split('#')[0]; }
function tegn() {
  if (!D) return;
  const r = rute();
  const ud = r.indexOf('t=') === 0 ? visTurnering(r.slice(2)) : r.indexOf('kopi=') === 0 ? visKopi(r.slice(5)) : r === 'fav' ? visFavoritter() : r === 'kort' ? visKort() : r === 'rtk' ? visRtk() : r === 'spillere' ? visSpillere() : visFind();
  const fokus = document.activeElement && document.activeElement.id === 'sog';
  const pos = fokus ? document.activeElement.selectionStart : 0;
  $('vis').innerHTML = ud;
  if (fokus && $('sog')) { $('sog').focus(); $('sog').setSelectionRange(pos, pos); }
  // Et anker efter ruten, fx #kort#licens, viser det kort med det samme
  const anker = decodeURIComponent(location.hash.slice(1)).split('#')[1];
  if (anker && $(anker)) $(anker).scrollIntoView();
}
function gaa(r) {
  if (r === 'tilbage') { if (history.length > 1 && window.TU_INDE) history.back(); else location.hash = 'find'; return; }
  window.TU_INDE = true;
  if ('#' + r === location.hash) tegn(); else location.hash = r;
  if (r.indexOf('t=') === 0 || r.indexOf('kopi=') === 0 || r === 'rtk' || r === 'spillere') window.scrollTo(0, 0);
}
window.addEventListener('hashchange', tegn);

$('vis').addEventListener('click', (e) => {
  const fav = e.target.closest('[data-fav]');
  if (fav) { e.stopPropagation(); skiftFavorit(fav.dataset.fav); return; }
  const g = e.target.closest('[data-gaa]');
  if (g) { gaa(g.dataset.gaa); return; }
  const c = e.target.closest('[data-chip]');
  if (c) {
    const k = c.dataset.chip, v = c.dataset.v;
    if (k === 'alder') V.alder = V.alder === v ? '' : v;
    else if (k === 'niveau') V.niveau = v;
    else if (k === 'koen') V.koen = v;
    else if (k === 'hvor') V.hvor = V.hvor === v ? '' : v;
    V.vis = 30; gemValg(); tegn(); return;
  }
  if (e.target.closest('#nu')) { V.nu = !V.nu; V.vis = 30; gemValg(); tegn(); return; }
  if (e.target.closest('#tlPush')) { pushSkift(); return; }
  if (e.target.closest('#visMere')) { V.vis += 30; tegn(); return; }
  if (e.target.closest('#rydSog') || e.target.closest('#rydSog2')) { V.sog = ''; tegn(); return; }
  const k = e.target.closest('[data-kopier]');
  if (k) { kopier(k.dataset.kopier, null, 'Koden er kopieret.', k); return; }
  const t = e.target.closest('[data-t]');
  if (t) gaa('t=' + t.dataset.t);
});
$('vis').addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-t]')) { e.preventDefault(); gaa('t=' + e.target.dataset.t); } });
$('vis').addEventListener('input', (e) => { if (e.target.id === 'sog') { V.sog = e.target.value; tegn(); } });

function kopier(tekst, el, ok, knap) {
  const faerdig = () => { if (el) besked(el, ok, 'ok'); if (knap) { const f = knap.textContent; knap.textContent = 'Kopieret'; setTimeout(() => { knap.textContent = f; }, 1500); } };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(tekst).then(faerdig).catch(() => gammel());
  else gammel();
  function gammel() { const ta = document.createElement('textarea'); ta.value = tekst; document.body.append(ta); ta.select(); try { document.execCommand('copy'); faerdig(); } catch (err) { if (el) besked(el, 'Kunne ikke kopiere. Markér teksten og kopiér selv.', 'err'); } ta.remove(); }
}

async function skiftFavorit(id) {
  const gemNu = FAV.indexOf(id) < 0;
  FAV = gemNu ? FAV.concat([id]) : FAV.filter((x) => x !== id);
  if (gemNu && !(D.favoritter || []).some((f) => f.id === id)) { const t = D.turneringer.filter((x) => x.id === id)[0]; D.favoritter.push({ id, findes: !!t, navn: t ? t.navn : '', fra: t ? t.fra : '', by: t ? t.by : '' }); }
  tegn();
  try { const r = await motor('turneringer', 'favorit', { id, gem: gemNu }); FAV = r.favoritter; huskData(); tegn(); }
  catch (err) { besked($('hentMsg'), 'Kunne ikke gemme favoritten: ' + err.message, 'err'); hentData(); }
}

function huskData() { try { D.favoritter = (D.favoritter || []).filter((f) => FAV.indexOf(f.id) >= 0); gem('rtk.turn', JSON.stringify({ t: token.slice(-16), d: D })); } catch (e) {} }
function brug(d) { D = d; FAV = (d.favoritter || []).map((f) => f.id); tegn(); }

async function hentData() {
  try {
    const d = await motor('turneringer', 'liste');
    besked($('hentMsg'), '');
    brug(d); huskData();
  } catch (err) { besked($('hentMsg'), err.message, 'err'); }
}

function start() {
  $('omraade').classList.remove('hidden');
  $('hvem').textContent = 'Logget ind som ' + person.navn;
  // Den sidste liste vises med det samme, og den nye hentes bagefter
  try { const g = JSON.parse(hent('rtk.turn') || 'null'); if (g && g.t === token.slice(-16) && g.d) { brug(g.d); besked($('hentMsg'), 'Henter det nyeste …'); } } catch (e) {}
  hentData();
}
function migHusket() { try { const m = JSON.parse(hent('rtk.mig') || 'null'); return m && token && m.t === token.slice(-16) ? m.p : null; } catch (e) { return null; } }
function migHent() { return motor('kerne', 'mig').then((p) => { gem('rtk.mig', JSON.stringify({ t: token.slice(-16), p: p })); return p; }); }
if (!token) location.replace('./?til=turneringer.html');
else { const husket = migHusket(); if (husket) { person = husket; start(); migHent().catch(() => {}); } else migHent().then((p) => { person = p; start(); }).catch((e) => besked($('hentMsg'), e.message, 'err')); }
</script>
