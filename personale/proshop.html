.card h3{margin:0 0 8px;font-size:17px}

<script>
// Adressen til motoren står i konfig.js (fælles for alle sider)
const MILJOE = window.RTK_KONFIG.miljoe;
const URL_MOTOR = window.RTK_KONFIG.motor;

// Pro shop: lager (Lars 15. november 2026 kl. 20.12 til 20.26). Kun administratorer med pinkoden.
// Faner: Lager, Ordrer, Optælling og Salg. Enheden (stk., rør, pakke) står ved hvert tal (Lars kl. 20.24).
// Optællingen er blind: det forventede vises først, når der er talt. Motoren tjekker alt igen (moduler/proshop.gs).
const $ = (id) => document.getElementById(id);
const gem = (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
const hent = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const kr = (n) => Number(n || 0).toLocaleString('da-DK', { minimumFractionDigits: 0, maximumFractionDigits: 2 }) + ' kr.';
const kr2 = (n) => Number(n || 0).toLocaleString('da-DK', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' kr.';
const talTekst = (n) => String(n).replace('.', ',');
const flertal = (e, n) => (Math.abs(n) === 1 ? e : ({ pakke: 'pakker', pose: 'poser' }[e] || e));
const mgd = (n, e) => talTekst(n) + ' ' + flertal(e || 'stk.', n);
const kortE = (e) => ({ pakke: 'pk.', pose: 'pose', par: 'par', 'stk.': 'stk.', 'rør': 'rør' }[e] || e);
const dag = (iso) => { if (!iso) return ''; const [a, m, d] = iso.split('-').map(Number); return new Date(a, m - 1, d).toLocaleDateString('da-DK', { weekday: 'short', day: 'numeric', month: 'short', year: a !== new Date().getFullYear() ? 'numeric' : undefined }); };
const idag = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
let token = hent('rtk.token') || '';
let person = null;
let O = null; // seneste oversigt
if (MILJOE === 'test') $('testBanner').classList.remove('hidden');
function besked(el, t, s) { el.textContent = t || ''; el.className = 'msg' + (s ? ' ' + s : ''); }

async function motor(modul, handling, data) {
  let res;
  try { res = await fetch(URL_MOTOR, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ modul, handling, data: data || {}, token, apin: (window.RTK_APIN ? RTK_APIN.bevis() : ''), id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()) }) }); }
  catch (e) { throw new Error('Ingen forbindelse. Tjek net og prøv igen.'); }
  let svar;
  try { svar = await res.json(); } catch (e) { throw new Error('Ingen forbindelse. Tjek net og prøv igen.'); }
  if (!svar.ok && svar.apin && window.RTK_APIN) { await RTK_APIN.spoerg(motor); return motor.apply(null, arguments); }
  if (!svar.ok) { if (svar.login) logUd(true); throw new Error(svar.fejl || 'Noget gik galt'); }
  return svar.data;
}
const ps = (h, d) => motor('proshop', h, d);

function logUd(udloebet) {
  if (window.RTK_UD) return; window.RTK_UD = true;
  if (!udloebet && token) motor('kerne', 'logud').catch(() => {});
  token = ''; person = null; gem('rtk.token', null); gem('rtk.mig', null);
  (window.RTKV ? RTKV.logUd() : Promise.resolve()).then(() => location.replace(udloebet ? './?til=proshop.html&igen=1' : './'));
}
$('logud').addEventListener('click', () => logUd(false));

// ------------------------------------------------------------ navigation
const vis = (html) => { $('vis').innerHTML = html; };
// Hvad hver fane er til, i almindeligt sprog (Lars 21. november 2026)
const FANE_HJ = {
  lager: 'Det, der står på hylden nu. Tryk på en vare for at se pris, bevægelser og historik.',
  ordrer: 'Bestillinger hos leverandørerne. Når en kasse kommer, tager du imod den her.',
  optael: 'Tæl hylden, så lageret passer med det, der faktisk står der.',
  salg: 'Læs salget fra MobilePay ind, så det solgte trækkes fra lageret.',
  marked: 'Vores priser mod Racketlife og andre netbutikker. Hentes selv hver mandag.'
};
function fane(navn) { document.querySelectorAll('#faner button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.fane === navn))); $('faneHj').textContent = FANE_HJ[navn] || ''; }
// En knap med en linje under, der siger, hvad der sker (label er færdig HTML)
const kn = (id, label, hjaelp, ghost) => '<div class="ps-kn"><button type="button"' + (ghost ? ' class="ghost"' : '') + ' id="' + id + '">' + label + '</button><small>' + esc(hjaelp) + '</small></div>';
const hj = (t) => '<small class="ps-hj">' + esc(t) + '</small>';
document.querySelectorAll('#faner button').forEach((b) => b.addEventListener('click', () => { location.hash = b.dataset.fane; }));
function gaa(h) { if (location.hash === '#' + h) route(); else location.hash = h; }
addEventListener('hashchange', route);
async function route() {
  const h = decodeURIComponent(location.hash.replace(/^#/, '')) || 'lager';
  const [a, b] = h.split('/');
  besked($('hentMsg'), 'Henter …');
  try {
    if (a === 'lager' || a === 'udgaaede') { fane('lager'); await visLager(a === 'udgaaede'); }
    else if (a === 'vare') { fane('lager'); await visVare(b); }
    else if (a === 'ny-vare') { fane('lager'); await visVareForm(null); }
    else if (a === 'ret') { fane('lager'); await visVareForm(b); }
    else if (a === 'lagerpr') { fane('lager'); await visLagerPr(); }
    else if (a === 'marked') { fane('marked'); await visMarked(); }
    else if (a === 'ordrer') { fane('ordrer'); await visOrdrer(); }
    else if (a === 'ny-ordre') { fane('ordrer'); await visNyOrdre(); }
    else if (a === 'ordre') { fane('ordrer'); await visOrdre(b); }
    else if (a === 'modtag') { fane('ordrer'); await visModtag(b); }
    else if (a === 'optael') { fane('optael'); await (b ? visOptaelling(b) : visOptael()); }
    else if (a === 'salg') { fane('salg'); await visSalg(); }
    else { fane('lager'); await visLager(false); }
    besked($('hentMsg'), '');
    window.scrollTo(0, 0);
  } catch (e) { if (!(e && e.apinAfbrudt)) besked($('hentMsg'), e.message, 'err'); }
}

// Fælles bindinger efter hver visning
function knap(id, fn) { const el = $(id); if (el) el.addEventListener('click', fn); }
async function gemMed(btn, msgEl, fn) {
  btn.disabled = true; besked(msgEl, 'Gemmer …');
  try { await fn(); } catch (e) { besked(msgEl, e.message, 'err'); } finally { btn.disabled = false; }
}
function stepper(id, v) {
  return '<span class="ps-step"><button type="button" class="ghost" data-step="-1" data-for="' + id + '" aria-label="En mindre">&#8722;</button>'
    + '<input id="' + id + '" inputmode="numeric" pattern="[0-9]*" value="' + (v === null || v === undefined ? '' : esc(v)) + '" aria-label="Antal">'
    + '<button type="button" class="ghost" data-step="1" data-for="' + id + '" aria-label="En mere">+</button></span>';
}
function bindSteppers() {
  document.querySelectorAll('[data-step]').forEach((b) => b.addEventListener('click', () => {
    const f = $(b.dataset.for); const v = Number(f.value || 0) + Number(b.dataset.step); f.value = Math.max(0, v); f.dispatchEvent(new Event('input'));
  }));
}
function chips(navn, liste, valgt) {
  return '<div class="chips" data-chips="' + navn + '">' + liste.map((x) => '<button type="button" aria-pressed="' + (x === valgt) + '" data-v="' + esc(x) + '">' + esc(x) + '</button>').join('') + '</div>';
}
function bindChips(navn, fn) {
  const c = document.querySelector('[data-chips="' + navn + '"]'); if (!c) return;
  c.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => { c.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); if (fn) fn(b.dataset.v); }));
}
const chipVal = (navn) => { const b = document.querySelector('[data-chips="' + navn + '"] button[aria-pressed="true"]'); return b ? b.dataset.v : ''; };

// ------------------------------------------------------------ Lager
async function visLager(udgaaede) {
  O = await ps('oversigt', { udgaaede });
  let h = '';
  if (!udgaaede) {
    h += '<div class="ps-kpi"><div><small>Lager til kostpris</small><b>' + kr(O.lagerKost) + '</b><small>det, varerne har kostet os</small></div><div><small>Til medlemspris</small><b>' + kr(O.lagerSalg) + '</b><small>det, de giver, når alt er solgt</small></div></div>';
    if (!O.start) h += '<div class="ps-alarm"><b>Startoptællingen mangler</b>Tæl hylden under Optælling, før varerne fra Racketlife lægges op. Salget kan først læses ind bagefter.</div>';
    O.igangOptaelling.forEach((o) => { h += '<a class="ps-info" style="display:block;text-decoration:none" href="#optael/' + esc(o.id) + '"><b>Optælling i gang (' + esc(o.type.toLowerCase()) + ')</b>' + (o.status === 'Talt' ? 'Talt. Mangler godkendelse.' : 'Ikke talt færdig.') + ' Åbn &#8594;</a>'; });
    const under = O.varer.filter((v) => v.underMin);
    if (under.length && O.start) h += '<div class="ps-alarm"><b>' + under.length + (under.length === 1 ? ' vare' : ' varer') + ' under minimum</b>' + under.slice(0, 4).map((v) => esc(v.navn) + ': ' + esc(v.antalTekst)).join(' · ') + (under.length > 4 ? ' og ' + (under.length - 4) + ' mere' : '') + '</div>';
    O.frister.forEach((f) => { if (f.snart || f.overskredet) h += '<div class="ps-frist"><b>' + esc(f.leverandoer) + (f.ordrenr ? ' ' + esc(f.ordrenr) : '') + (f.overskredet ? ': klarmeldingen er overskredet' : '') + '</b>Dag 75 ' + dag(f.dag75) + ' · klarmelding dag 80 ' + dag(f.dag80) + ' · forfald ' + dag(f.forfald) + '</div>'; });
    if (O.bolde && O.bolde.mangler.length) h += '<div class="ps-alarm"><b>Bolde fra Boldlager uden vare</b>' + O.bolde.mangler.map((m) => esc(m.dato + ': ' + m.bold + ', ' + m.antal + '. ' + m.grund)).join('<br>') + '</div>';
    if (O.start && O.salg.huller.length) h += '<div class="ps-alarm"><b>Salg mangler fra MobilePay</b>' + esc(O.salg.huller.join(' og ')) + '</div>';
    if (O.markedDato) {
      const over = O.varer.filter((v) => v.marked && v.marked.regel === 'Over').length;
      h += '<a class="' + (over ? 'ps-alarm' : 'ps-info') + '" style="display:block;text-decoration:none" href="#marked"><b>Markedspriser ' + esc(dag(O.markedDato)) + (over ? ': ' + over + (over === 1 ? ' vare over markedet' : ' varer over markedet') : '') + '</b>' + (O.markedForslag.length ? O.markedForslag.length + (O.markedForslag.length === 1 ? ' forslag' : ' forslag') + ' til justering.' : 'Ingen forslag.') + ' Åbn &#8594;</a>';
    } else h += '<a class="ps-info" style="display:block;text-decoration:none" href="#marked"><b>Markedspriser</b>' + (O.markedOpsat ? 'Ingen priser hentet endnu.' : 'Ingen links endnu.') + ' Åbn &#8594;</a>';
    if (O.start) h += '<p class="hint" style="margin:0 0 10px">Salget er læst ind ' + (O.salg.til ? 'til og med ' + dag(O.salg.til) : 'fra startoptællingen ' + dag(O.start) + ': intet endnu').replace(/\.$/, '') + '.</p>';
  } else h += '<a class="ps-tilbage" href="#lager">&#8592; Lager</a><h2 style="margin:0 0 10px">Udgåede varer</h2>';
  if (!udgaaede) h += forklaring();
  h += '<input id="soeg" type="search" placeholder="Søg vare eller varenummer" aria-label="Søg vare eller varenummer" style="margin:0 0 6px">';
  h += '<div id="liste"></div>';
  if (!udgaaede) h += '<div class="ps-knapper">' + kn('nyVare', '+ Ny vare', 'Opret en vare, der skal sælges i shoppen. Lageret starter på 0.') + '</div>'
    + '<div class="ps-knapper">' + kn('udg', 'Udgåede varer', 'Varer, der ikke sælges mere.', true) + kn('lagerpr', 'Lagerstatus pr. dato', 'Lagerets antal og værdi en bestemt dag, fx til revisoren.', true) + '</div>';

  h += '<h2 style="margin:0 0 4px">' + (o.status === 'Talt' ? 'Forskellen' : 'Optælling ' + esc(dag(o.dato))) + '</h2><p class="hint" style="margin:0 0 10px">' + esc(o.type + ', ' + o.omfang.toLowerCase() + (o.grund ? '. ' + o.grund : '') + '. Talt af ' + (o.taltAf || 'ingen') + (o.godkendtAf ? ', ' + (o.status === 'Annulleret' ? 'annulleret' : 'godkendt') + ' af ' + o.godkendtAf : '')) + '.</p>';
  const diff = o.linjer.filter((l) => l.forskel);
  h += '<div class="card"><table class="ps-tab"><tr><th>Vare</th><th class="n">Forv.</th><th class="n">Talt</th><th class="n">Forskel</th></tr>' + o.linjer.filter((l) => o.status === 'Talt' ? true : true).map((l) => '<tr><td>' + esc(l.navn) + ' <span class="hint" style="font-size:12px">' + esc(kortE(l.enhed)) + '</span></td><td class="n">' + esc(talTekst(l.forventet)) + '</td><td class="n">' + esc(talTekst(l.talt)) + '</td><td class="n ' + (l.forskel > 0 ? 'ps-plus' : l.forskel < 0 ? 'ps-minus' : '') + '">' + (l.forskel ? esc((l.forskel > 0 ? '+' : '') + mgd(l.forskel, l.enhed)) : '0') + (l.grund && o.status === 'Godkendt' && l.forskel ? '<br><span class="hint" style="font-size:12px">' + esc(l.grund) + '</span>' : '') + '</td></tr>').join('') + '</table></div>';
  if (o.status === 'Talt') {
    if (o.type === 'Start') h += '<p class="ps-info">Startoptællingen sætter lageret til det talte. Forskellen bogføres som startlager uden grund.</p>';
    else if (diff.length) {
      h += '<div class="card"><h3>Grund til hver forskel</h3>';
      diff.forEach((l) => {
        const kost = l.kostpris ? ' (' + kr2(Math.abs(l.forskel) * l.kostpris) + ' til kostpris)' : '';
        h += '<label style="margin-top:10px">' + esc(l.navn + ': ' + (l.forskel > 0 ? '+' : '') + mgd(l.forskel, l.enhed) + kost) + '</label>' + chips('g_' + l.varenr, l.forskel < 0 ? d.grundeMinus : d.grundePlus, '');
        if (l.forskel > 0 && /\bBA50/.test(l.varenr)) h += '<p class="hint" style="margin:4px 0 0">Bolde: "Udtag mangler i boldlageret" sender en besked til Anders. Hylden passer, når udtaget er registreret.</p>';
      });
      h += '</div>';
    } else h += '<p class="ps-info">Ingen forskelle. Lageret passer.</p>';
    if (d.salg && o.type !== 'Start') {
      const s = d.salg; const mangler = s.huller.length || !s.til || s.til < o.dato;
      if (mangler) h += '<p class="ps-alarm"><b>Salget er ikke læst ind til og med ' + esc(dag(o.dato)) + '</b>' + (s.huller.length ? 'Der mangler salg for ' + esc(s.huller.join(' og ')) + '. ' : 'Læst ind til ' + esc(s.til ? dag(s.til) : 'ingenting') + '. ') + 'Hent salget fra MobilePay og læs det ind under Salg, før optællingen godkendes, ellers bliver salget regnet som svind.</p>';
    }
    h += '<label for="gNote">Note (valgfri)</label><input id="gNote" maxlength="200">';
    h += '<div class="ps-knapper">' + kn('godkend', 'Godkend optælling', 'Lageret sættes til det talte, og svind bogføres til kostpris.' + (o.type === 'Årsafslutning' ? ' Årsafslutningen godkendes af en anden administrator end den, der talte.' : '')) + '</div>'
      + '<div class="ps-knapper">' + kn('igen', 'Tæl igen', 'Tæl hylden en gang til. Intet er bogført endnu.', true) + kn('annuller', 'Annullér', 'Optællingen droppes, og intet bogføres.', true) + '</div><div class="msg" id="gMsg"></div>';
  }
  vis(h);
  diff.forEach((l) => bindChips('g_' + l.varenr));
  let salgOk = false;
  knap('godkend', (e) => gemMed(e.target, $('gMsg'), async () => {
    const grunde = {}; diff.forEach((l) => { grunde[l.varenr] = chipVal('g_' + l.varenr); });
    const r = await ps('optaelGodkend', { id: o.id, grunde, note: $('gNote').value, salgOk });
    if (r.advarsel) { salgOk = true; besked($('gMsg'), r.advarsel + ' Tryk igen for at godkende alligevel.', 'err'); e.target.textContent = 'Godkend alligevel'; return; }
    besked($('gMsg'), 'Godkendt.', 'okm'); setTimeout(route, 700);
  }));
  knap('igen', () => visTael(o, '<a class="ps-tilbage" href="#optael">&#8592; Optælling</a>', o.linjer));
  knap('annuller', (e) => { if (!confirm('Annullér optællingen? Intet bogføres.')) return; gemMed(e.target, $('gMsg'), async () => { await ps('optaelAnnuller', { id: o.id }); gaa('optael'); }); });
}

function visTael(o, h, tidl) {
  const tal = {}; (tidl || []).forEach((l) => { tal[l.varenr] = l.talt; });
  h += '<h2 style="margin:0 0 4px">Tæl hylden</h2><p class="hint" style="margin:0 0 10px">' + esc(o.type + ', ' + o.omfang.toLowerCase()) + ', ' + o.linjer.length + (o.linjer.length === 1 ? ' vare' : ' varer') + '. Det forventede antal vises først, når du er færdig, så tallet ikke styrer optællingen. Skriv 0, hvis der ingen er.</p><div class="card">';
  o.linjer.forEach((l, i) => { h += '<div class="ps-mod"><span class="ps-k"><b>' + esc(l.navn) + '</b><small>' + esc((l.indhold ? l.indhold + ' · ' : '') + 'tæl ' + flertal(l.enhed, 2) + (l.enhed === 'rør' ? ', ikke bolde' : '')) + '</small></span>' + stepper('t' + i, tal[l.varenr] !== undefined ? tal[l.varenr] : (l.talt !== null && l.talt !== undefined ? l.talt : '')) + '<span class="ps-e">' + esc(kortE(l.enhed)) + '</span></div>'; });
  h += '</div><div class="ps-knapper">' + kn('faerdig', 'Færdig, vis forskellen', 'Gemmer det talte og viser, hvor det afviger fra lageret. Intet er bogført endnu.') + '</div><div class="msg" id="tMsg"></div>';
  vis(h); bindSteppers();
  knap('faerdig', (e) => gemMed(e.target, $('tMsg'), async () => {
    const linjer = o.linjer.map((l, i) => ({ varenr: l.varenr, talt: $('t' + i).value.trim() }));
    const tom = linjer.filter((l) => l.talt === ''); if (tom.length) throw new Error('Skriv det talte ved alle varer, også 0. Mangler: ' + o.linjer.filter((l, i) => linjer[i].talt === '').map((l) => l.navn).join(', '));
    await ps('optaelTael', { id: o.id, linjer });
    if (location.hash === '#optael/' + o.id) route(); else gaa('optael/' + o.id);
  }));
}

// ------------------------------------------------------------ Salg
async function visSalg() {
  const d = await ps('salgListe');
  const s = d.status;
  let h = '<div class="card"><h3>Salg fra MobilePay #' + esc(s.nummer) + '</h3>';
  h += '<p class="tu-p" style="margin:0 0 8px">' + (s.til ? 'Læst ind til og med <b>' + esc(dag(s.til)) + '</b>.' : 'Intet læst ind endnu.') + '</p>';
  if (s.huller.length) h += '<p class="ps-alarm"><b>Der mangler salg</b>' + esc(s.huller.join(' og ')) + '</p>';
  h += '<p class="hint" style="margin:0 0 10px">Brug filen "salg pr. vare" for pro shoppens nummer (Rapporter, fanen MobilePay-nummer-salg). Perioden skal starte dagen efter det, der er læst ind. En fil, der dækker en periode, der allerede er læst ind (fx hele måneden), bogfører kun det nye. Filen gemmes i arkivet med fingeraftryk.</p>';
  h += '<label for="sFil">Fil (xlsx)</label><input type="file" id="sFil" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">';
  h += '<div class="ps-knapper">' + kn('sLaes', 'Læs salget ind', 'Trækker det solgte fra lageret. Dage, der allerede er læst ind, tælles ikke to gange.') + '</div><div class="msg" id="sMsg"></div><div id="sUd"></div></div>';
  h += '<div class="card"><h3>Indlæst</h3>' + (d.liste.length ? '<table class="ps-tab"><tr><th>Periode</th><th class="n">Antal</th><th class="n">Beløb</th></tr>' + d.liste.map((x) => '<tr><td>' + esc(dag(x.fra) + ' til ' + dag(x.til)) + '<br><span class="ps-kd">' + esc(x.fingeraftryk) + '</span> <span class="hint" style="font-size:12px">' + esc(x.status === 'Indlæst' ? x.af : x.status.toLowerCase()) + '</span></td><td class="n">' + esc(x.antal) + '</td><td class="n">' + kr(x.beloeb) + '</td></tr>').join('') + '</table>' : '<p class="hint">Intet endnu.</p>') + '</div>';
  vis(h);
  let filData = null;
  const laes = async (btn) => {
    const f = $('sFil').files[0]; if (!f && !filData) throw new Error('Vælg filen');
    if (f) filData = { navn: f.name, b64: await new Promise((ok, nej) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = () => nej(new Error('Filen kunne ikke læses')); r.readAsDataURL(f); }) };
    const r = await ps('salgIndlaes', { filnavn: filData.navn, fil: filData.b64 });
    if (r.ukendte) {
      besked($('sMsg'), '');
      $('sUd').innerHTML = '<p class="ps-alarm" style="margin-top:10px"><b>' + r.ukendte.length + (r.ukendte.length === 1 ? ' ukendt navn' : ' ukendte navne') + ' i MobilePay</b>Kobl ' + (r.ukendte.length === 1 ? 'det' : 'dem') + ' til en vare. Koblingen gælder fremover.</p>'
        + r.ukendte.map((n, i) => '<label for="k' + i + '">"' + esc(n) + '" er</label><select id="k' + i + '" data-navn="' + esc(n) + '"><option value="">Vælg vare</option>' + r.varer.map((v) => '<option value="' + esc(v.varenr) + '">' + esc(v.navn) + '</option>').join('') + '</select>').join('')
        + '<div class="ps-knapper">' + kn('kobl', 'Kobl og læs ind', 'Husker, hvilken vare navnet er, og læser salget ind.') + '</div>';
      knap('kobl', (e) => gemMed(e.target, $('sMsg'), async () => {
        for (const s of document.querySelectorAll('[data-navn]')) { if (!s.value) throw new Error('Vælg en vare for "' + s.dataset.navn + '"'); await ps('salgKobl', { navn: s.dataset.navn, varenr: s.value }); }
        await laes();
      }));
      return;
    }
    besked($('sMsg'), 'Læst ind: ' + dag(r.fra) + ' til ' + dag(r.til) + ', ' + kr(r.beloeb) + '. Fingeraftryk ' + r.fingeraftryk + '.', 'okm');
    $('sUd').innerHTML = '<table class="ps-tab" style="margin-top:10px"><tr><th>Vare</th><th class="n">Solgt</th><th class="n">Bogført nu</th></tr>' + r.linjer.map((l) => '<tr><td>' + esc(l.navn) + '</td><td class="n">' + esc(l.tekst) + '</td><td class="n">' + esc(l.bogfoertTekst) + '</td></tr>').join('') + '</table>'
      + (r.daekker ? '<p class="hint">Filen dækker ' + r.daekker + (r.daekker === 1 ? ' tidligere indlæsning' : ' tidligere indlæsninger') + '. Kun det nye er bogført.</p>' : '') + '<div class="ps-knapper">' + kn('opd', 'Opdater listen', 'Viser den nye indlæsning i listen Indlæst.', true) + '</div>';
    knap('opd', () => route());
  };
  knap('sLaes', (e) => gemMed(e.target, $('sMsg'), () => laes()));
}

// ------------------------------------------------------------ start
function start() {
  $('omraade').classList.remove('hidden');
  $('hvem').textContent = 'Logget ind som ' + person.navn;
  if ((person.roller || []).indexOf('admin') < 0) { $('ikkeAdmin').classList.remove('hidden'); return; }
  $('indhold').classList.remove('hidden');
  (window.RTK_APIN ? RTK_APIN.sikr(motor) : Promise.resolve()).then(route).catch((e) => { if (!(e && e.apinAfbrudt)) besked($('hentMsg'), e.message, 'err'); });
}
function migHusket() { try { const m = JSON.parse(hent('rtk.mig') || 'null'); return m && token && m.t === token.slice(-16) ? m.p : null; } catch (e) { return null; } }
function migHent() { return motor('kerne', 'mig').then((p) => { gem('rtk.mig', JSON.stringify({ t: token.slice(-16), p: p })); return p; }); }
if (!token) location.replace('./?til=proshop.html');
else { const husket = migHusket(); if (husket) { person = husket; start(); migHent().then((p) => { if (JSON.stringify(husket.roller || []) !== JSON.stringify(p.roller || [])) location.reload(); }).catch(() => {}); } else migHent().then((p) => { person = p; start(); }).catch(() => {}); }
</script>
