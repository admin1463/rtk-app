<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
// Strengeskemaet vises som en side i app'en, så der altid er en vej tilbage (Lars 20. oktober kl. 07.15)
(async function () {
  const st = document.getElementById('status');
  // Fra hjemmeskærmen åbner en PDF uden tilbageknap, så hent-linket vises kun i browseren
  if (window.navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches)) document.getElementById('hent').parentNode.remove();
  const sider = document.getElementById('sider');
  try {
    if (!window.pdfjsLib) throw new Error('pdf.js mangler');
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf = await pdfjsLib.getDocument('strengeskema.pdf').promise;
    const bredde = Math.min(sider.clientWidth || 360, 900);
    const tæthed = Math.min(3, Math.max(2, window.devicePixelRatio || 1));
    for (let i = 1; i <= pdf.numPages; i++) {
      const side = await pdf.getPage(i);
      const vp = side.getViewport({ scale: tæthed * bredde / side.getViewport({ scale: 1 }).width });
      const c = document.createElement('canvas');
      c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
      c.setAttribute('role', 'img');
      c.setAttribute('aria-label', 'Strengeskema side ' + i + ' af ' + pdf.numPages);
      sider.appendChild(c);
      await side.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    }
    st.remove();
  } catch (e) {
    st.textContent = 'Skemaet kunne ikke vises lige nu. Tjek forbindelsen og prøv igen.';
  }
})();
</script>
