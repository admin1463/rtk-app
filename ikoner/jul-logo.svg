<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Julefrokost">
  <!-- Julelogo: ølkrus med nissehue og en tennisbold som kvast. Hvidt i samme flade stil som RTK-logoet,
       mellemrummene er gennemsigtige (maske), så det virker på alle baggrunde. -->
  <defs>
    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <!-- luft mellem huens kant, huen og kruset -->
      <path d="M10 37.5 H70" stroke="#000" stroke-width="3"/>
      <path d="M10 48.5 H70" stroke="#000" stroke-width="3"/>
      <!-- de lodrette riller i kruset -->
      <rect x="29" y="56" width="4.5" height="27" rx="2.2" fill="#000"/>
      <rect x="44" y="56" width="4.5" height="27" rx="2.2" fill="#000"/>
      <!-- luft om bolden -->
      <circle cx="78" cy="24" r="13.5" fill="#000"/>
    </mask>
  </defs>
  <g fill="#fff" mask="url(#m)">
    <!-- huen -->
    <path d="M15 37 C16 18 28 5 46 4 C58 3.5 66 8 72 15 L68 21 C61 15 54 13 49 15 C58 22 62 29 64 37 Z"/>
    <!-- kanten af pels -->
    <rect x="11" y="38" width="58" height="10" rx="5"/>
    <!-- kruset -->
    <path d="M17 49 H63 V86 a6 6 0 0 1 -6 6 H23 a6 6 0 0 1 -6 -6 Z"/>
  </g>
  <!-- hanken -->
  <path d="M63 56 H71 a8 8 0 0 1 8 8 V74 a8 8 0 0 1 -8 8 H63" fill="none" stroke="#fff" stroke-width="7"/>
  <!-- tennisbolden som kvast, tegnet som bolden i RTK-logoet -->
  <circle cx="78" cy="24" r="11" fill="none" stroke="#fff" stroke-width="3.6"/>
  <path d="M69.5 17 C75 20 75 28 69.5 31" fill="none" stroke="#fff" stroke-width="3"/>
  <path d="M86.5 17 C81 20 81 28 86.5 31" fill="none" stroke="#fff" stroke-width="3"/>
</svg>
